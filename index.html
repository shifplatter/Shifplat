<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Rating App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: black;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .upload-box {
      background: white;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 30px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .upload-box h2 {
      margin-bottom: 15px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 12px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      background: black;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .card-content {
      padding: 20px;
    }

    .stars {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .star {
      font-size: 28px;
      cursor: pointer;
      color: gray;
    }

    .star.active {
      color: gold;
    }

    .rating-text {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>

<header>
  <h1>🍔 Food Rating App</h1>
  <p>Upload food photos and let people rate them</p>
</header>

<div class="container">

  <div class="upload-box">
    <h2>➕ Upload Food Photo</h2>

    <input type="text" id="restaurant" placeholder="Restaurant Name" />

    <input type="text" id="food" placeholder="Food Name" />

    <textarea id="details" placeholder="Food Details"></textarea>

    <input type="file" id="imageUpload" accept="image/*" />

    <button onclick="uploadFood()">Upload Food</button>
  </div>

  <div class="gallery" id="gallery"></div>

</div>

<script>
  function uploadFood() {
    const restaurant = document.getElementById('restaurant').value;
    const food = document.getElementById('food').value;
    const details = document.getElementById('details').value;
    const imageInput = document.getElementById('imageUpload');

    if (!imageInput.files[0]) {
      alert('Please upload an image');
      return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
      const imageUrl = e.target.result;

      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <img src="${imageUrl}" />

        <div class="card-content">
          <h2>${food}</h2>
          <h4>${restaurant}</h4>
          <p>${details}</p>

          <div class="rating-text">
            ⭐ Rate this food and photo from 1 to 5
          </div>

          <div class="stars">
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
          </div>
        </div>
      `;

      const stars = card.querySelectorAll('.star');

      stars.forEach((star, index) => {
        star.addEventListener('click', () => {
          stars.forEach((s, i) => {
            if (i <= index) {
              s.classList.add('active');
            } else {
              s.classList.remove('active');
            }
          });
        });
      });

      document.getElementById('gallery').prepend(card);

      document.getElementById('restaurant').value = '';
      document.getElementById('food').value = '';
      document.getElementById('details').value = '';
      document.getElementById('imageUpload').value = '';
    };

    reader.readAsDataURL(imageInput.files[0]);
  }
</script>

</body>
</html>
