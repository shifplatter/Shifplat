<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShifPlatter User Ratings</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.container{
max-width:900px;
margin:auto;
padding:15px;
}

.card{
background:white;
padding:15px;
border-radius:18px;
margin-bottom:18px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.logo-header{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
margin-bottom:20px;
}

.logo-img{
width:130px;
height:130px;
object-fit:contain;
border-radius:25px;
background:white;
padding:10px;
box-shadow:0 6px 20px rgba(0,0,0,0.12);
}

.logo-title{
font-size:32px;
font-weight:bold;
margin-top:10px;
color:#0d3b3b;
}

.logo-sub{
font-size:15px;
color:#666;
margin-top:5px;
text-align:center;
}

.topbar{
display:flex;
align-items:center;
gap:12px;
background:white;
padding:12px 18px;
border-radius:18px;
margin-bottom:20px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.topbar-logo{
width:55px;
height:55px;
border-radius:14px;
object-fit:contain;
}

.topbar-title{
font-size:22px;
font-weight:bold;
color:#0d3b3b;
}

.topbar-sub{
font-size:13px;
color:#666;
}

input,textarea{
width:100%;
padding:14px;
margin-top:12px;
border-radius:14px;
border:1px solid #ddd;
box-sizing:border-box;
font-size:15px;
}

button{
border:none;
padding:14px;
border-radius:14px;
cursor:pointer;
font-weight:bold;
}

.full-btn{
width:100%;
background:black;
color:white;
margin-top:15px;
}

.tabs{
display:flex;
gap:8px;
overflow:auto;
margin-bottom:20px;
}

.tab-btn{
flex:1;
background:#e5e5e5;
padding:12px;
font-weight:bold;
white-space:nowrap;
}

.active-tab{
background:black;
color:white;
}

.hidden{
display:none;
}

.food-image{
width:100%;
height:320px;
object-fit:cover;
border-radius:18px;
margin-bottom:12px;
cursor:pointer;
}

.stars{
display:flex;
gap:5px;
margin-top:12px;
}

.star{
font-size:34px;
cursor:pointer;
color:#ccc;
transition:0.2s;
}

.star.active{
color:gold;
transform:scale(1.12);
}

.comment{
background:#fafafa;
padding:10px;
border-radius:12px;
margin-top:10px;
border:1px solid #eee;
}

.comment-actions{
display:flex;
gap:10px;
margin-top:15px;
}

.comment-actions button{
flex:1;
}

.gauge{
width:100%;
height:18px;
background:#ddd;
border-radius:30px;
overflow:hidden;
margin-top:15px;
}

.gauge-fill{
height:100%;
background:linear-gradient(
90deg,
#00c853,
#64dd17
);
}

.top3-wrap{
display:flex;
justify-content:center;
align-items:flex-end;
gap:15px;
margin-top:30px;
flex-wrap:wrap;
}

.podium{
width:120px;
border-radius:25px;
text-align:center;
padding:15px;
position:relative;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
}

.first{
background:#ffe082;
height:240px;
}

.second{
background:#eeeeee;
height:190px;
}

.third{
background:#ffccbc;
height:170px;
}

.rank-avatar{
width:80px;
height:80px;
border-radius:50%;
object-fit:cover;
margin-top:-50px;
border:5px solid white;
cursor:pointer;
}

.crown{
position:absolute;
top:-35px;
right:35px;
font-size:40px;
}

.rank-name{
font-size:18px;
font-weight:bold;
margin-top:10px;
}

.rank-score{
font-size:18px;
margin-top:10px;
font-weight:bold;
}

.rank-number{
font-size:70px;
font-weight:bold;
margin-top:15px;
opacity:0.25;
}

@media(max-width:768px){

.food-image{
height:250px;
}

.logo-img{
width:110px;
height:110px;
}

}

</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="loginPage" class="card">

<div class="logo-header">

<img src="logo.png" class="logo-img">

<div class="logo-title">
ShifPlatter
</div>

<div class="logo-sub">
Rate • Review • Discover Amazing Food
</div>

</div>

<h3 style="text-align:center;color:#666;">
Login with your Instagram username
</h3>

<input
type="text"
id="username"
placeholder="@instagram_username"
>

<input
type="text"
id="instaName"
placeholder="Your Name"
>

<button
class="full-btn"
onclick="loginUser()">
Continue
</button>

</div>

<!-- MAIN APP -->

<div id="mainApp" class="hidden">

<div class="topbar">

<img src="logo.png" class="topbar-logo">

<div>

<div class="topbar-title">
ShifPlatter
</div>

<div class="topbar-sub">
Food Community Ratings
</div>

</div>

<button
onclick="logoutUser()"
style="
margin-left:auto;
background:black;
color:white;
padding:10px 16px;
border:none;
border-radius:12px;
">
Logout
</button>

</div>

<!-- TABS -->

<div class="tabs">

<button
class="tab-btn active-tab"
onclick="showTab('galleryTab',this)">
Gallery
</button>

<button
class="tab-btn"
onclick="showTab('ratingsTab',this)">
Overall Ratings
</button>

<button
class="tab-btn"
onclick="showTab('uploadTab',this)">
Upload Your Image
</button>

<button
class="tab-btn"
onclick="showTab('leaderboardTab',this)">
Leaderboard
</button>

</div>

<!-- GALLERY -->

<div id="galleryTab">
<div id="gallery"></div>
</div>

<!-- RATINGS -->

<div id="ratingsTab" class="hidden">
<div id="overallRatings"></div>
</div>

<!-- UPLOAD -->

<div id="uploadTab" class="hidden">

<div class="card">

<h2>Upload Your Food Photo</h2>

<input
type="file"
id="userFoodImage"
accept="image/*"
>

<input
type="text"
id="userRestaurant"
placeholder="Restaurant / Cafe Name"
>

<input
type="text"
id="userFoodName"
placeholder="Food Name"
>

<textarea
id="userFoodDetails"
placeholder="Food Details">
</textarea>

<button
class="full-btn"
onclick="uploadUserFood()">
Upload Photo
</button>

<p style="
margin-top:12px;
font-size:14px;
color:#666;
">
Only admin can see uploaded photos.
</p>

</div>

</div>

<!-- LEADERBOARD -->

<div id="leaderboardTab" class="hidden">
<div id="leaderboard"></div>
</div>

</div>

</div>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyCQ0YG2sulip67LaN7SBm4Bw6WduRchJTE",
    authDomain: "shifplatter-e0449.firebaseapp.com",
    databaseURL: "https://shifplatter-e0449-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shifplatter-e0449",
    storageBucket: "shifplatter-e0449.firebasestorage.app",
    messagingSenderId: "873786528833",
    appId: "1:873786528833:web:e72394fec2ce9f8b52a2c0"
  };


firebase.initializeApp(firebaseConfig);

const db=firebase.database();

let currentUser="";
let currentName="";

window.onload=function(){

const savedUser=
localStorage.getItem("shiftUser");

const savedName=
localStorage.getItem("shiftName");

if(savedUser && savedName){

currentUser=savedUser;
currentName=savedName;

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("mainApp")
.classList.remove("hidden");

loadFoods();

}

};

function loginUser(){

const username=
document
.getElementById("username")
.value.trim();

const instaName=
document
.getElementById("instaName")
.value.trim();

if(!username || !instaName){

alert("Please enter details");

return;

}

currentUser=username;
currentName=instaName;

localStorage.setItem(
"shiftUser",
username
);

localStorage.setItem(
"shiftName",
instaName
);

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("mainApp")
.classList.remove("hidden");

loadFoods();

}

function logoutUser(){

localStorage.removeItem("shiftUser");
localStorage.removeItem("shiftName");

location.reload();

}

function showTab(tabId,btn){

document
.querySelectorAll(
"#galleryTab,#ratingsTab,#uploadTab,#leaderboardTab"
)
.forEach((tab)=>{

tab.classList.add("hidden");

});

document
.getElementById(tabId)
.classList.remove("hidden");

document
.querySelectorAll(".tab-btn")
.forEach((b)=>{

b.classList.remove("active-tab");

});

btn.classList.add("active-tab");

}

function loadFoods(){

const gallery=
document.getElementById("gallery");

const overall=
document.getElementById("overallRatings");

const leaderboard=
document.getElementById("leaderboard");

gallery.innerHTML="";
overall.innerHTML="";
leaderboard.innerHTML="";

db.ref("foods")
.on("value",(snapshot)=>{

gallery.innerHTML="";
overall.innerHTML="";
leaderboard.innerHTML="";

const data=snapshot.val();

if(!data){

gallery.innerHTML=`
<div class="card">
No foods uploaded yet
</div>
`;

return;

}

const foods=[];

Object.keys(data).forEach((id)=>{

const item=data[id];

if(!item.ratings){

item.ratings=[];

}

let total=0;

item.ratings.forEach((r)=>{

total+=Number(r.rating||0);

});

let avg=0;

if(item.ratings.length>0){

avg=
total/item.ratings.length;

}

foods.push({
id,
avg,
item
});

});

foods.sort((a,b)=>b.avg-a.avg);

foods.forEach((food)=>{

const id=food.id;
const item=food.item;
const avg=food.avg;

gallery.innerHTML+=`

<div class="card">

<img
class="food-image"
src="${item.image}"
onclick="openImage('${item.image}')"
>

<h2>${item.foodname}</h2>

<p>
<b>${item.restaurant}</b>
</p>

<p>${item.details}</p>

<div class="stars">

<span class="star"
onclick="rateFood('${id}',1,event)">
☆</span>

<span class="star"
onclick="rateFood('${id}',2,event)">
☆</span>

<span class="star"
onclick="rateFood('${id}',3,event)">
☆</span>

<span class="star"
onclick="rateFood('${id}',4,event)">
☆</span>

<span class="star"
onclick="rateFood('${id}',5,event)">
☆</span>

</div>

<div class="comment-actions">

<button
class="full-btn"
onclick="toggleCommentBox('${id}')">
Comment
</button>

<button
class="full-btn"
onclick="toggleComments('${id}')">
View Comments
</button>

</div>

<div
id="commentBox-${id}"
class="hidden">

<textarea
id="comment-${id}"
placeholder="Write review...">
</textarea>

<button
class="full-btn"
onclick="addComment('${id}')">
Post
</button>

</div>

<div
id="comments-${id}"
class="hidden">
</div>

</div>

`;

overall.innerHTML+=`

<div class="card">

<h3>${item.foodname}</h3>

<p>${item.restaurant}</p>

<div class="gauge">

<div
class="gauge-fill"
style="width:${avg*20}%">
</div>

</div>

<p>
⭐ ${avg.toFixed(1)}/5
</p>

</div>

`;

});

if(foods[0]){

leaderboard.innerHTML=`

<div class="card">

<h1 style="
text-align:center;
margin-bottom:25px;
">
🏆 Top Food Leaderboard
</h1>

<div class="top3-wrap">

${foods[1] ? `
<div class="podium second">

<img
class="rank-avatar"
src="${foods[1].item.image}"
onclick="openImage('${foods[1].item.image}')"
>

<div class="rank-name">
${foods[1].item.foodname}
</div>

<div class="rank-score">
⭐ ${foods[1].avg.toFixed(1)}
</div>

<div class="rank-number">
2
</div>

</div>
` : ""}

${foods[0] ? `
<div class="podium first">

<div class="crown">
👑
</div>

<img
class="rank-avatar"
src="${foods[0].item.image}"
onclick="openImage('${foods[0].item.image}')"
>

<div class="rank-name">
${foods[0].item.foodname}
</div>

<div class="rank-score">
⭐ ${foods[0].avg.toFixed(1)}
</div>

<div class="rank-number">
1
</div>

</div>
` : ""}

${foods[2] ? `
<div class="podium third">

<img
class="rank-avatar"
src="${foods[2].item.image}"
onclick="openImage('${foods[2].item.image}')"
>

<div class="rank-name">
${foods[2].item.foodname}
</div>

<div class="rank-score">
⭐ ${foods[2].avg.toFixed(1)}
</div>

<div class="rank-number">
3
</div>

</div>
` : ""}

</div>

</div>

`;

}

});

}

function rateFood(foodId,rating,event){

const stars =
event.target.parentElement
.querySelectorAll(".star");

stars.forEach((s,index)=>{

if(index < rating){

s.classList.add("active");
s.innerHTML="★";

}else{

s.classList.remove("active");
s.innerHTML="☆";

}

});

db.ref("foods/"+foodId+"/ratings")
.once("value")
.then((snapshot)=>{

let ratings=snapshot.val() || [];

ratings = ratings.filter(
(r)=>r.user!==currentUser
);

ratings.push({

user:currentUser,
name:currentName,
rating

});

db.ref("foods/"+foodId+"/ratings")
.set(ratings);

});

const toast=document.createElement("div");

toast.innerHTML="⭐ Rating Saved";

toast.style.position="fixed";
toast.style.bottom="20px";
toast.style.left="50%";
toast.style.transform="translateX(-50%)";
toast.style.background="black";
toast.style.color="white";
toast.style.padding="12px 20px";
toast.style.borderRadius="14px";
toast.style.zIndex="9999";

document.body.appendChild(toast);

setTimeout(()=>{

toast.remove();

},1200);

}

function addComment(foodId){

const input=
document.getElementById(
"comment-"+foodId
);

const text=input.value.trim();

if(!text){

alert("Write review");

return;

}

db.ref("foods/"+foodId)
.once("value")
.then((snapshot)=>{

const item=snapshot.val();

if(!item.comments){

item.comments={};

}

const key=Date.now();

item.comments[key]={

user:currentUser,
comment:text

};

db.ref("foods/"+foodId)
.set(item)
.then(()=>{

input.value="";

alert("Review added");

});

});

}

function toggleCommentBox(id){

document
.getElementById(
"commentBox-"+id
)
.classList.toggle("hidden");

}

function toggleComments(id){

const div=
document.getElementById(
"comments-"+id
);

div.classList.toggle("hidden");

if(!div.innerHTML){

db.ref("foods/"+id)
.once("value")
.then((snapshot)=>{

const item=snapshot.val();

if(item.comments){

Object.values(item.comments)
.reverse()
.forEach((c)=>{

div.innerHTML+=`

<div class="comment">

<b>${c.user}</b>

<p>${c.comment}</p>

</div>

`;

});

}

});

}

}

function uploadUserFood(){

const imageFile=
document
.getElementById("userFoodImage")
.files[0];

const restaurant=
document
.getElementById("userRestaurant")
.value;

const foodname=
document
.getElementById("userFoodName")
.value;

const details=
document
.getElementById("userFoodDetails")
.value;

if(
!imageFile ||
!restaurant ||
!foodname ||
!details
){

alert("Please fill all details");

return;

}

const reader=new FileReader();

reader.onload=function(){

const uploadData={

image:reader.result,
restaurant,
foodname,
details,
uploadedBy:currentUser,
uploadedEmail:currentName,
time:Date.now()

};

db.ref("userUploads")
.push(uploadData)
.then(()=>{

alert("Photo uploaded successfully");

document
.getElementById("userFoodImage")
.value="";

document
.getElementById("userRestaurant")
.value="";

document
.getElementById("userFoodName")
.value="";

document
.getElementById("userFoodDetails")
.value="";

});

};

reader.readAsDataURL(imageFile);

}

function openImage(src){

const win=window.open("");

win.document.write(`

<html>

<head>

<title>Food Image</title>

<style>

body{
margin:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

img{
max-width:100%;
max-height:100%;
}

</style>

</head>

<body>

<img src="${src}">

</body>

</html>

`);

}

</script>

</body>
</html>
