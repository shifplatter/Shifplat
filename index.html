<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShifPlatter - User</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{
background:linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)),
url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1600&auto=format&fit=crop");
background-size:cover;
background-position:center;
min-height:100vh;
color:white;
}
.container{width:100%;max-width:1200px;margin:auto;padding:16px;}
.login-card{padding:35px 22px;border-radius:32px;margin-top:35px;box-shadow:0 8px 30px rgba(0,0,0,0.25);text-align:center;background:rgba(255,255,255,0.12);backdrop-filter:blur(18px);}
.logo{width:135px;height:135px;object-fit:contain;border-radius:28px;display:block;margin:auto;background:white;padding:10px;}
.main-title{font-size:44px;font-weight:900;margin-top:18px;letter-spacing:1px;color:#FFD700;}
.sub-title{font-size:15px;margin-top:8px;color:#f1f1f1;}
input,textarea{width:100%;padding:16px;border-radius:18px;border:none;margin-top:14px;font-size:15px;outline:none;background:rgba(255,255,255,0.92);color:#111;}
textarea{min-height:120px;resize:none;}
.main-btn{width:100%;padding:16px;border:none;border-radius:18px;background:#FFD700;color:black;font-size:16px;font-weight:900;margin-top:18px;cursor:pointer;transition:0.2s;}
.main-btn:hover{transform:scale(1.02);}
.tabs{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
.tab-btn{flex:1;padding:15px;border:none;border-radius:18px;font-size:15px;font-weight:bold;cursor:pointer;background:rgba(255,255,255,0.2);color:white;backdrop-filter:blur(10px);}
.active-tab{background:#FFD700;color:black;}
.card{padding:20px;border-radius:30px;margin-bottom:22px;box-shadow:0 8px 25px rgba(0,0,0,0.22);}
.food-image{width:100%;height:300px;object-fit:cover;border-radius:24px;cursor:pointer;}
.food-title{font-size:30px;font-weight:900;margin-top:16px;}
.food-sub{font-size:15px;margin-top:6px;color:#ddd;}
.food-desc{margin-top:12px;font-size:14px;line-height:1.7;color:#f1f1f1;}
.stars{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap;}
.star{font-size:56px;cursor:pointer;color:#cfcfcf;transition:0.2s;user-select:none;}
.star:hover{transform:scale(1.12);}
.active-star{color:#FFD700 !important;text-shadow:0 0 12px rgba(255,215,0,1),0 0 20px rgba(255,215,0,0.9),0 0 30px rgba(255,215,0,0.7);transform:scale(1.08);}
.leaderboard-title{font-size:44px;font-weight:900;text-align:center;margin-bottom:90px;}
.leaderboard-container{display:flex;justify-content:center;align-items:flex-end;gap:26px;flex-wrap:wrap;padding-top:35px;}
.leaderboard-box{width:260px;border-radius:36px;padding:22px 18px;position:relative;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,0.25);}
.first-place{background:linear-gradient(180deg,#ffe27a,#f8c400);height:530px;color:black;}
.second-place{background:linear-gradient(180deg,#f0f0f0,#d9d9d9);height:440px;color:black;}
.third-place{background:linear-gradient(180deg,#f8d2c5,#e6a78f);height:400px;color:black;}
.rank-image{width:150px;height:150px;border-radius:50%;object-fit:cover;border:8px solid white;margin-top:-95px;box-shadow:0 8px 22px rgba(0,0,0,0.18);}
.rank-food{font-size:28px;font-weight:900;margin-top:18px;}
.rank-rating{font-size:24px;font-weight:bold;margin-top:12px;}
.rank-number{position:absolute;bottom:0;left:50%;transform:translateX(-50%);font-size:140px;font-weight:900;opacity:0.15;}
.crown{position:absolute;top:-58px;left:50%;transform:translateX(-50%);font-size:82px;}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#FFD700;color:black;padding:13px 22px;border-radius:16px;font-weight:900;z-index:9999;box-shadow:0 6px 20px rgba(0,0,0,0.25);}
@media(max-width:768px){.food-image{height:220px;}.food-title{font-size:24px;}.star{font-size:42px;}.leaderboard-box{width:100%;max-width:320px;height:auto !important;padding-bottom:90px;}.rank-image{width:110px;height:110px;margin-top:-65px;}.rank-number{font-size:95px;}}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="loginPage" class="login-card glass">
<img src="logo.png" class="logo">
<div class="main-title">ShifPlatter</div>
<div class="sub-title">Login with your Instagram username</div>
<input type="text" id="username" placeholder="@instagram_username">
<input type="text" id="name" placeholder="Your Name">
<button class="main-btn" onclick="loginUser()">Continue</button>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="hidden">

<div class="tabs">
<button class="tab-btn active-tab" onclick="showTab('galleryTab',this)">Gallery</button>
<button class="tab-btn" onclick="showTab('ratingsTab',this)">Ratings</button>
<button class="tab-btn" onclick="showTab('uploadTab',this)">Upload</button>
<button class="tab-btn" onclick="showTab('leaderboardTab',this)">Leaderboard</button>
</div>

<div id="galleryTab"></div>
<div id="ratingsTab" class="hidden"></div>
<div id="uploadTab" class="hidden"></div>
<div id="leaderboardTab" class="hidden"></div>

</div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCQ0YG2sulip67LaN7SBm4Bw6WduRchJTE",
    authDomain: "shifplatter-e0449.firebaseapp.com",
    databaseURL: "https://shifplatter-e0449-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shifplatter-e0449",
    storageBucket: "shifplatter-e0449.firebasestorage.app",
    messagingSenderId: "873786528833",
    appId: "1:873786528833:web:e72394fec2ce9f8b52a2c0"
  };
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

let currentUser="";
let currentName="";
const userRatings={};

function loginUser(){
  const username=document.getElementById("username").value.trim();
  const name=document.getElementById("name").value.trim();
  if(!username || !name){alert("Enter details"); return;}
  currentUser=username;
  currentName=name;
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("mainApp").classList.remove("hidden");
  loadFoods();
}

function showTab(tabId,btn){
  document.querySelectorAll('#galleryTab,#ratingsTab,#uploadTab,#leaderboardTab').forEach(tab=>tab.classList.add('hidden'));
  document.getElementById(tabId).classList.remove('hidden');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active-tab'));
  btn.classList.add('active-tab');
}

function loadFoods(){
  const gallery=document.getElementById('galleryTab');
  const ratingsContainer=document.getElementById('ratingsTab');
  const leaderboardContainer=document.getElementById('leaderboardTab');
  const uploadSection=document.getElementById('uploadTab');

  // UPLOAD
  uploadSection.innerHTML=`
  <div class="card glass">
    <h2>Upload Food</h2>
    <input type="file" id="foodImage" accept="image/*">
    <input type="text" id="restaurant" placeholder="Restaurant / Cafe Name">
    <input type="text" id="foodname" placeholder="Food Name">
    <textarea id="details" placeholder="Food Details"></textarea>
    <button class="main-btn" onclick="uploadFood()">Upload Food</button>
  </div>`;

  db.ref("foods").on("value",snapshot=>{
    const data=snapshot.val()||{};
    gallery.innerHTML="";
    ratingsContainer.innerHTML="";
    let leaderboardArr=[];

    Object.keys(data).forEach(id=>{
      const item=data[id];
      const ratingsArr=item.ratings||[];
      const avg=ratingsArr.length?ratingsArr.reduce((a,b)=>a+b.rating,0)/ratingsArr.length:0;
      leaderboardArr.push({name:item.foodname,image:item.image,rating:avg});

      // Gallery
      gallery.innerHTML+=`
      <div class="card glass">
        <img src="${item.image}" class="food-image">
        <div class="food-title">${item.foodname}</div>
        <div class="food-sub">${item.restaurant}</div>
        <div class="food-desc">${item.details}</div>
        <div class="stars">${[1,2,3,4,5].map(num=>`<span class="star ${userRatings[id]>=num?'active-star':''}" onclick="rateFood(this,'${id}',${num})">★</span>`).join("")}</div>
      </div>`;

      // Ratings Container
      ratingsContainer.innerHTML+=`
      <div class="card glass">
        <div>${item.foodname} - ${item.restaurant}</div>
        <div class="gauge"><div class="gauge-fill" style="width:${avg*20}%"></div></div>
        <div class="gauge-text">${avg.toFixed(1)}/5</div>
      </div>`;
    });

    // Leaderboard
    leaderboardArr.sort((a,b)=>b.rating-a.rating);
    const top3=leaderboardArr.slice(0,3);
    leaderboardContainer.innerHTML="";
    const order=[top3[1],top3[0],top3[2]];
    const positions=["second-place","first-place","third-place"];
    order.forEach((food,i)=>{
      if(!food) return;
      leaderboardContainer.innerHTML+=`
      <div class="card glass leaderboard-box ${positions[i]}">
        <img src="${food.image}" class="rank-image">
        <div class="rank-food">${food.name}</div>
        <div class="rank-rating">⭐ ${food.rating.toFixed(1)}</div>
      </div>`;
    });
  });
}

function rateFood(el,foodId,rating){
  const starsContainer=el.parentElement;
  const stars=starsContainer.querySelectorAll(".star");
  userRatings[foodId]=rating;
  stars.forEach((star,index)=>{index<rating?star.classList.add("active-star"):star.classList.remove("active-star");});
  db.ref("foods/"+foodId+"/ratings").once("value").then(snapshot=>{
    let ratings=snapshot.val()||[];
    const exists=ratings.find(r=>r.email===currentUser);
    if(exists){alert("You already rated"); return;}
    ratings.push({user:currentUser,name:currentName,rating});
    db.ref("foods/"+foodId+"/ratings").set(ratings);
  }).then(()=>{showToast("⭐ Rating Saved Successfully");});
}

function uploadFood(){
  const file=document.getElementById("foodImage").files[0];
  const restaurant=document.getElementById("restaurant").value;
  const foodname=document.getElementById("foodname").value;
  const details=document.getElementById("details").value;
  if(!file||!restaurant||!foodname||!details){alert("Fill all fields");return;}
  const reader=new FileReader();
  reader.onload=function(e){
    db.ref("userUploads").push({uploadedName:currentName,uploadedBy:currentUser,restaurant,foodname,details,image:e.target.result,time:Date.now()});
    showToast("✅ Photo sent to admin for approval");
  };
  reader.readAsDataURL(file);
}

function showToast(text){
  const toast=document.createElement("div");
  toast.className="toast";
  toast.innerHTML=text;
  document.body.appendChild(toast);
  setTimeout(()=>{toast.remove();},1800);
}
</script>
</body>
</html>
