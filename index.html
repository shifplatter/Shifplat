<script>

/* FIREBASE CONFIG */

const firebaseConfig = {

apiKey: "AIzaSyCQ0YG2sulip67LaN7SBm4Bw6WduRchJTE",
authDomain: "shifplatter-e0449.firebaseapp.com",
databaseURL: "https://shifplatter-e0449-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "shifplatter-e0449",
storageBucket: "shifplatter-e0449.firebasestorage.app",
messagingSenderId: "873786528833",
appId: "1:873786528833:web:e72394fec2ce9f8b52a2c0"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let currentUser = "";
let currentName = "";

let foodsCache = {};
let userRatings = {};

</script>

<script>

/* LOGIN */

function loginUser(){

const username =
document.getElementById("username")
.value.trim();

const name =
document.getElementById("name")
.value.trim();

if(!username || !name){

alert("Enter your details");
return;

}

currentUser = username;
currentName = name;

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("app")
.classList.remove("hidden");

loadFoods();

}

/* TAB SWITCH */

function switchTab(tabId,btn){

document
.querySelectorAll(".tab-page")
.forEach(tab=>{

tab.classList.add("hidden");

});

document
.getElementById(tabId)
.classList.remove("hidden");

document
.querySelectorAll(".nav-btn")
.forEach(nav=>{

nav.classList.remove("active-nav");

});

btn.classList.add("active-nav");

}

/* IMAGE VIEWER */

function openImageViewer(url){

document
.getElementById("modalImage")
.src = url;

document
.getElementById("imageModal")
.classList.remove("hidden");

}

function closeImageViewer(){

document
.getElementById("imageModal")
.classList.add("hidden");

}

/* TOAST */

function showToast(text){

const toast =
document.createElement("div");

toast.innerHTML = text;

toast.style.position = "fixed";
toast.style.bottom = "90px";
toast.style.left = "50%";
toast.style.transform = "translateX(-50%)";

toast.style.background = "#FFD700";
toast.style.color = "#000";

toast.style.padding = "14px 22px";
toast.style.borderRadius = "16px";

toast.style.fontWeight = "700";
toast.style.zIndex = "999999";

document.body.appendChild(toast);

setTimeout(()=>{

toast.remove();

},2000);

}

/* LOAD FOODS */

function loadFoods(){

db.ref("foods")
.on("value",(snapshot)=>{

foodsCache =
snapshot.val() || {};

renderGallery();
renderRatings();
renderLeaderboard();

});

}

/* GALLERY */

function renderGallery(){

const container =
document.getElementById(
"galleryContainer"
);

container.innerHTML = "";

const ids =
Object.keys(foodsCache);

ids.reverse();

ids.forEach(id=>{

const item =
foodsCache[id];

let avg = 0;
let count = 0;

if(item.ratings){

const ratings =
Object.values(item.ratings);

count = ratings.length;

let total = 0;

ratings.forEach(r=>{

total += Number(
r.rating || 0
);

});

if(count){

avg = total / count;

}

}

container.innerHTML += `

<div class="food-card">

<img
src="${item.image}"
class="food-image"
loading="lazy"
onclick="openImageViewer('${item.image}')">

<div class="food-content">

<div class="food-title">
${item.foodname || ""}
</div>

<div class="food-sub">
${item.restaurant || ""}
</div>

<div class="food-desc">
${item.details || ""}
</div>

<div class="uploader">

<div class="avatar">

${(item.uploadedBy || "U")
.charAt(0)
.toUpperCase()}

</div>

<div>

<div style="font-weight:700;">
@${item.uploadedBy || "Unknown"}
</div>

<div style="
font-size:12px;
color:#ccc;
">

Uploaded this food

</div>

</div>

</div>

<div style="
margin-top:15px;
font-weight:700;
">

⭐ ${avg.toFixed(1)}
(${count} ratings)

</div>

<div
class="stars"
id="stars-${id}">

${createStars(id)}

</div>

<button
class="comment-btn"
onclick="toggleComments('${id}')">

💬 Comments

</button>

<div
id="comments-${id}"
class="comments-box hidden">

</div>

</div>

</div>

`;

});

}

function createStars(foodId){

let html = "";

for(let i=1;i<=5;i++){

html += `

<span
class="star ${
(userRatings[foodId]||0)>=i
? 'active'
: 'inactive'
}"
onclick="rateFood('${foodId}',${i})">

★

</span>

`;

}

return html;

}

function rateFood(foodId,rating){

userRatings[foodId] =
rating;

/* INSTANT UPDATE */

document
.getElementById(
`stars-${foodId}`
)
.innerHTML =
createStars(foodId);

db.ref(
`foods/${foodId}/ratings`
).push({

user:currentUser,
name:currentName,
rating:rating

});

showToast(
"⭐ Rating Saved"
);

}

</script>

<script>

/* COMMENTS */

function toggleComments(foodId){

const box =
document.getElementById(
`comments-${foodId}`
);

if(box.classList.contains("hidden")){

box.classList.remove("hidden");

loadComments(foodId);

}else{

box.classList.add("hidden");

}

}

function loadComments(foodId){

const box =
document.getElementById(
`comments-${foodId}`
);

box.innerHTML =
"Loading comments...";

db.ref(
`foods/${foodId}/comments`
)
.once("value")
.then(snapshot=>{

const data =
snapshot.val();

if(!data){

box.innerHTML = `

<div class="comment">
No comments yet
</div>

<textarea
id="commentInput-${foodId}"
placeholder="Write a comment"></textarea>

<button
class="comment-btn"
onclick="postComment('${foodId}')">

Post Comment

</button>

`;

return;

}

let html = "";

Object.values(data)
.reverse()
.forEach(c=>{

html += `

<div class="comment">

<div class="comment-user">
@${c.user}
</div>

<div>
${c.comment}
</div>

</div>

`;

});

html += `

<textarea
id="commentInput-${foodId}"
placeholder="Write a comment"></textarea>

<button
class="comment-btn"
onclick="postComment('${foodId}')">

Post Comment

</button>

`;

box.innerHTML = html;

});

}

function postComment(foodId){

const input =
document.getElementById(
`commentInput-${foodId}`
);

const text =
input.value.trim();

if(!text){

alert("Write a comment");
return;

}

db.ref(
`foods/${foodId}/comments`
)
.push({

user:currentUser,
comment:text,
time:Date.now()

})
.then(()=>{

showToast(
"💬 Comment Posted"
);

loadComments(foodId);

});

}

/* UPLOAD FOOD */

function uploadFood(){

const file =
document.getElementById(
"foodImage"
).files[0];

if(!file){

alert("Choose an image");
return;

}

const restaurant =
document.getElementById(
"restaurant"
).value.trim();

const foodname =
document.getElementById(
"foodname"
).value.trim();

const details =
document.getElementById(
"details"
).value.trim();

const reader =
new FileReader();

reader.onload = function(e){

db.ref("foods")
.push({

restaurant,
foodname,
details,

image:e.target.result,

uploadedBy:currentUser,
uploaderName:currentName,

uploadTime:Date.now()

})
.then(()=>{

document.getElementById(
"restaurant"
).value="";

document.getElementById(
"foodname"
).value="";

document.getElementById(
"details"
).value="";

document.getElementById(
"foodImage"
).value="";

showToast(
"✅ Food Uploaded"
);

});

};

reader.readAsDataURL(file);

}

/* RATINGS PAGE */

function renderRatings(){

const container =
document.getElementById(
"ratingsContainer"
);

container.innerHTML = "";

Object.keys(foodsCache)
.forEach(id=>{

const item =
foodsCache[id];

let avg = 0;
let count = 0;

if(item.ratings){

const arr =
Object.values(item.ratings);

count = arr.length;

let total = 0;

arr.forEach(r=>{

total += Number(
r.rating || 0
);

});

if(count){

avg = total/count;

}

}

container.innerHTML += `

<div class="rating-card">

<h3>
${item.foodname}
</h3>

<p>
${item.restaurant}
</p>

<div class="rating-bar">

<div
class="rating-fill"
style="
width:${avg*20}%;
">

</div>

</div>

<p style="
margin-top:10px;
font-weight:bold;
">

⭐ ${avg.toFixed(1)}
(${count} ratings)

</p>

</div>

`;

});

}

/* LEADERBOARD */

function renderLeaderboard(){

const container =
document.getElementById(
"leaderboardContainer"
);

container.innerHTML = "";

let foods = [];

Object.keys(foodsCache)
.forEach(id=>{

const item =
foodsCache[id];

let avg = 0;

if(item.ratings){

const arr =
Object.values(item.ratings);

let total = 0;

arr.forEach(r=>{

total += Number(
r.rating || 0
);

});

if(arr.length){

avg = total / arr.length;

}

}

foods.push({

name:item.foodname,
image:item.image,
rating:avg

});

});

foods.sort(
(a,b)=>
b.rating-a.rating
);

foods.slice(0,3)
.forEach((food,index)=>{

let rankClass =
"rank-3";

if(index===0)
rankClass="rank-1";

if(index===1)
rankClass="rank-2";

container.innerHTML += `

<div class="rank-card ${rankClass}">

<img
src="${food.image}"
class="rank-image">

<h2 style="
margin-top:15px;
">

${food.name}

</h2>

<p style="
font-weight:bold;
margin-top:10px;
">

⭐ ${food.rating.toFixed(1)}

</p>

</div>

`;

});

}

/* CLOSE IMAGE MODAL WHEN BACKGROUND CLICKED */

document
.getElementById("imageModal")
.addEventListener("click",(e)=>{

if(
e.target.id==="imageModal"
){

closeImageViewer();

}

});

</script>
