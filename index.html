<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShifPlatter</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
/* Keep all your previous styles */
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{
  background: linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)), url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1600&auto=format&fit=crop");
  background-size: cover;
  background-position: center;
  min-height: 100vh;
  color:white;
}
/* Include your glass effect, cards, stars, leaderboard, responsive styles here */
/* ... all your previous CSS remains unchanged ... */
</style>
</head>
<body>

<div class="container">

<!-- LOGIN -->
<div id="loginPage" class="login-card glass">
<img src="logo.png" class="logo">
<div class="main-title">ShifPlatter</div>
<div class="sub-title">Login with your Instagram username</div>
<input type="text" id="username" placeholder="@instagram_username">
<input type="text" id="name" placeholder="Your Name">
<button class="main-btn" onclick="loginUser()">Continue</button>
</div>

<!-- MAIN APP -->
<div id="mainApp" class="hidden">

<!-- TOPBAR -->
<div class="topbar glass">
<img src="logo.png" class="top-logo">
<div>
<div class="top-title">ShifPlatter</div>
<div style="font-size:13px;color:#f1f1f1;">Community Food Ratings</div>
</div>
</div>

<!-- TABS -->
<div class="tabs">
<button class="tab-btn active-tab" onclick="showTab('galleryTab',this)">Gallery</button>
<button class="tab-btn" onclick="showTab('ratingsTab',this)">Ratings</button>
<button class="tab-btn" onclick="showTab('uploadTab',this)">Upload</button>
<button class="tab-btn" onclick="showTab('leaderboardTab',this)">Leaderboard</button>
</div>

<!-- GALLERY -->
<div id="galleryTab"><div id="gallery"></div></div>

<!-- RATINGS -->
<div id="ratingsTab" class="hidden"><div id="ratingsContainer"></div></div>

<!-- UPLOAD -->
<div id="uploadTab" class="hidden">
<div class="card glass">
<h2>Upload Food</h2>
<input type="file" id="foodImage" accept="image/*">
<input type="text" id="restaurant" placeholder="Restaurant / Cafe Name">
<input type="text" id="foodname" placeholder="Food Name">
<textarea id="details" placeholder="Food Details"></textarea>
<button class="main-btn" onclick="uploadFood()">Upload Food</button>
</div>
</div>

<!-- LEADERBOARD -->
<div id="leaderboardTab" class="hidden">
<div class="card glass">
<h1 class="leaderboard-title">🏆 Top Food Leaderboard</h1>
<div id="leaderboardContainer" class="leaderboard-container"></div>
</div>
</div>

</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCQ0YG2sulip67LaN7SBm4Bw6WduRchJTE",
    authDomain: "shifplatter-e0449.firebaseapp.com",
    databaseURL: "https://shifplatter-e0449-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shifplatter-e0449",
    storageBucket: "shifplatter-e0449.firebasestorage.app",
    messagingSenderId: "873786528833",
    appId: "1:873786528833:web:e72394fec2ce9f8b52a2c0"
  };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

let currentUser="";
let currentName="";
const userRatings={};

/* LOGIN */
function loginUser(){
  const username = document.getElementById("username").value.trim();
  const name = document.getElementById("name").value.trim();
  if(!username || !name){alert("Enter details"); return;}
  currentUser=username;
  currentName=name;
  document.getElementById("loginPage").classList.add("hidden");
  document.getElementById("mainApp").classList.remove("hidden");
  loadFoods();
}

/* TABS */
function showTab(tabId,btn){
  document.querySelectorAll("#galleryTab,#ratingsTab,#uploadTab,#leaderboardTab").forEach(tab=>tab.classList.add("hidden"));
  document.getElementById(tabId).classList.remove("hidden");
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.remove("active-tab"));
  btn.classList.add("active-tab");
}

/* LOAD FOODS */
function loadFoods(){
  db.ref("foods").on("value",snapshot=>{
    const data = snapshot.val();
    const gallery = document.getElementById("gallery");
    const ratings = document.getElementById("ratingsContainer");
    gallery.innerHTML="";
    ratings.innerHTML="";
    if(!data) return;
    loadLeaderboard(data);
    Object.keys(data).forEach(id=>{
      const item=data[id];
      if(!item.ratings) item.ratings=[];
      let total = item.ratings.reduce((a,b)=>a+(b.rating||0),0);
      let avg = item.ratings.length>0? total/item.ratings.length : 0;
      // Gallery
      gallery.innerHTML += `
        <div class="card glass">
          <img src="${item.image}" class="food-image">
          <div class="food-title">${item.foodname}</div>
          <div class="food-sub">${item.restaurant}</div>
          <div class="food-desc">${item.details}</div>
          <div class="stars">${[1,2,3,4,5].map(num=>`
            <span class="star ${userRatings[id]>=num?'active-star':''}" onclick="rateFood(this,'${id}',${num})">★</span>
          `).join("")}</div>
        </div>`;
      // Ratings
      ratings.innerHTML += `
        <div class="card glass">
          <h2>${item.foodname}</h2>
          <p>${item.restaurant}</p>
          <div class="gauge"><div class="gauge-fill" style="width:${avg*20}%"></div></div>
          <p style="margin-top:12px;font-size:18px;font-weight:bold;">⭐ ${avg.toFixed(1)}/5</p>
        </div>`;
    });
  });
}

/* RATE FOOD */
function rateFood(el,foodId,rating){
  const starsContainer = el.parentElement;
  const stars = starsContainer.querySelectorAll(".star");
  userRatings[foodId]=rating;
  stars.forEach((star,index)=>{index<rating?star.classList.add("active-star"):star.classList.remove("active-star");});
  db.ref("foods/"+foodId+"/ratings").once("value").then(snap=>{
    let ratings = snap.val()||[];
    ratings.push({user:currentUser,name:currentName,rating:rating});
    return db.ref("foods/"+foodId+"/ratings").set(ratings);
  }).then(()=>showToast("⭐ Rating Saved Successfully"));
}

/* UPLOAD ONLY TO userUploads */
function uploadFood(){
  const file=document.getElementById("foodImage").files[0];
  const restaurant=document.getElementById("restaurant").value;
  const foodname=document.getElementById("foodname").value;
  const details=document.getElementById("details").value;
  if(!file){alert("Upload image"); return;}
  const reader = new FileReader();
  reader.onload = function(e){
    const data={
      restaurant,
      foodname,
      details,
      image:e.target.result,
      uploadedName:currentName,
      uploadedBy:currentUser,
      time:Date.now()
    };
    db.ref("userUploads").push(data);
    showToast("✅ Uploaded Successfully");
    // Clear inputs
    document.getElementById("foodImage").value='';
    document.getElementById("restaurant").value='';
    document.getElementById("foodname").value='';
    document.getElementById("details").value='';
  };
  reader.readAsDataURL(file);
}

/* LEADERBOARD */
function loadLeaderboard(data){
  const leaderboard = document.getElementById("leaderboardContainer");
  leaderboard.innerHTML="";
  let foods=[];
  Object.keys(data).forEach(id=>{
    const item=data[id];
    if(!item.ratings) return;
    let total = item.ratings.reduce((a,b)=>a+(b.rating||0),0);
    let avg = item.ratings.length>0? total/item.ratings.length : 0;
    foods.push({name:item.foodname,image:item.image,rating:avg});
  });
  foods.sort((a,b)=>b.rating-a.rating);
  const top3=foods.slice(0,3);
  const order=[top3[1],top3[0],top3[2]];
  const positions=["second-place","first-place","third-place"];
  const rankNumbers=[2,1,3];
  order.forEach((food,index)=>{
    if(!food) return;
    leaderboard.innerHTML += `
      <div class="leaderboard-box ${positions[index]}">
      ${rankNumbers[index]===1?`<div class="crown">👑</div>`:``}
      <img src="${food.image}" class="rank-image">
      <div class="rank-food">${food.name}</div>
      <div class="rank-rating">⭐ ${food.rating.toFixed(1)}</div>
      <div class="rank-number">${rankNumbers[index]}</div>
      </div>`;
  });
}

/* TOAST */
function showToast(text){
  const toast=document.createElement("div");
  toast.className="toast";
  toast.innerHTML=text;
  document.body.appendChild(toast);
  setTimeout(()=>toast.remove(),1800);
}
</script>
</body>
</html>
