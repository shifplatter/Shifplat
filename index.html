<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rate Your View</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

body{
margin:0;
padding:0;
background:#f5f5f5;
font-family:Arial,sans-serif;
}

.container{
max-width:900px;
margin:auto;
padding:15px;
}

.card{
background:white;
padding:15px;
border-radius:18px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

input,textarea{
width:100%;
padding:14px;
border-radius:14px;
border:1px solid #ddd;
margin-top:12px;
box-sizing:border-box;
}

button{
border:none;
border-radius:14px;
padding:14px;
cursor:pointer;
}

.full-btn{
width:100%;
background:black;
color:white;
margin-top:15px;
}

.tabs{
display:flex;
gap:8px;
margin-bottom:20px;
overflow:auto;
}

.tab-btn{
flex:1;
background:#e5e5e5;
font-weight:bold;
white-space:nowrap;
}

.active-tab{
background:black;
color:white;
}

.hidden{
display:none;
}

.food-card{
display:flex;
gap:15px;
align-items:flex-start;
}

.food-image{
width:90px;
height:90px;
object-fit:cover;
border-radius:14px;
cursor:pointer;
flex-shrink:0;
}

.stars{
display:flex;
gap:5px;
margin-top:10px;
}

.star{
font-size:28px;
color:#ccc;
cursor:pointer;
}

.star.active{
color:gold;
}

.loader{
text-align:center;
padding:30px;
}

.gauge-wrap{
margin-top:15px;
}

.gauge{
width:100%;
height:18px;
background:#ddd;
border-radius:30px;
overflow:hidden;
}

.gauge-fill{
height:100%;
background:linear-gradient(
90deg,
#00c853,
#64dd17
);
}

.gauge-text{
margin-top:8px;
font-size:14px;
font-weight:bold;
}

</style>

</head>
<body>

<div class="container">

<div class="card" id="loginPage">

<h1>Rate Your View</h1>

<p>
Rate your favorite food photos
</p>

<input
type="text"
id="username"
placeholder="Enter Username"
>

<input
type="email"
id="email"
placeholder="Enter Email Address"
>

<button
class="full-btn"
onclick="loginUser()">
Continue
</button>

</div>

<div id="mainApp" class="hidden">

<div class="tabs">

<button
class="tab-btn active-tab"
onclick="showTab('galleryTab',this)">
Gallery
</button>

<button
class="tab-btn"
onclick="showTab('ratingsTab',this)">
Ratings
</button>

<button
class="tab-btn"
onclick="showTab('graphTab',this)">
Graph
</button>

<button
class="tab-btn"
onclick="showTab('uploadTab',this)">
Upload Your Image
</button>

</div>

<div id="galleryTab">

<div id="gallery"></div>

</div>

<div id="ratingsTab" class="hidden">

<div id="overallRatings"></div>

</div>

<div id="graphTab" class="hidden">

<div id="graphContainer"></div>

</div>

<div id="uploadTab" class="hidden">

<div class="card">

<h2>Upload Your Food</h2>

<input
type="file"
id="userFoodImage"
accept="image/*"
>

<input
type="text"
id="userRestaurant"
placeholder="Restaurant / Cafe Name"
>

<input
type="text"
id="userFoodName"
placeholder="Food Name"
>

<textarea
id="userDetails"
placeholder="Food Details">
</textarea>

<button
class="full-btn"
onclick="uploadUserFood()">
Upload Food
</button>

</div>

</div>

</div>

</div>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyCQ0YG2sulip67LaN7SBm4Bw6WduRchJTE",
    authDomain: "shifplatter-e0449.firebaseapp.com",
    databaseURL: "https://shifplatter-e0449-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shifplatter-e0449",
    storageBucket: "shifplatter-e0449.firebasestorage.app",
    messagingSenderId: "873786528833",
    appId: "1:873786528833:web:e72394fec2ce9f8b52a2c0"
  };

firebase.initializeApp(firebaseConfig);

const db=firebase.database();

let currentUser="";
let currentEmail="";

window.onload=function(){

const savedUser=
localStorage.getItem("shiftUser");

const savedEmail=
localStorage.getItem("shiftEmail");

if(savedUser && savedEmail){

currentUser=savedUser;
currentEmail=savedEmail;

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("mainApp")
.classList.remove("hidden");

loadFoods();

}

};

function loginUser(){

const username=
document
.getElementById("username")
.value.trim();

const email=
document
.getElementById("email")
.value.trim();

if(!username || !email){

alert("Please enter details");

return;

}

if(
username.toUpperCase()==="SHIFPLATTER" &&
email.toUpperCase()==="SHIVIK@2030"
){

window.location.href="admin.html";

return;

}

currentUser=username;
currentEmail=email;

localStorage.setItem(
"shiftUser",
username
);

localStorage.setItem(
"shiftEmail",
email
);

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("mainApp")
.classList.remove("hidden");

loadFoods();

}

function showTab(tabId,btn){

requestAnimationFrame(()=>{

document
.querySelectorAll(
"#galleryTab,#ratingsTab,#graphTab,#uploadTab"
)
.forEach((tab)=>{

tab.classList.add("hidden");

});

document
.getElementById(tabId)
.classList.remove("hidden");

document
.querySelectorAll(".tab-btn")
.forEach((b)=>{

b.classList.remove("active-tab");

});

btn.classList.add("active-tab");

});

}

function loadFoods(){

const gallery=
document.getElementById("gallery");

const overall=
document.getElementById("overallRatings");

const graph=
document.getElementById("graphContainer");

gallery.innerHTML=
'<div class="loader">Loading...</div>';

db.ref("foods")
.limitToLast(20)
.once("value")
.then((snapshot)=>{

const data=snapshot.val();

gallery.innerHTML="";
overall.innerHTML="";
graph.innerHTML="";

if(!data){

gallery.innerHTML=`
<div class="card">
No foods uploaded yet
</div>
`;

return;

}

Object.keys(data)
.reverse()
.forEach((id)=>{

const item=data[id];

if(!item.ratings){

item.ratings=[];

}

let total=0;

item.ratings.forEach((r)=>{

total+=Number(r.rating||0);

});

let avg=0;

if(item.ratings.length>0){

avg=
total/item.ratings.length;

}

const card=
document.createElement("div");

card.className="card";

card.innerHTML=`

<div class="food-card">

<img
class="food-image"
src="${item.image}"
loading="lazy"
onclick="window.open('${item.image}')"
>

<div>

<h3>${item.foodname}</h3>

<p>
<b>${item.restaurant}</b>
</p>

<p>${item.details}</p>

<div class="stars">

<span class="star">☆</span>
<span class="star">☆</span>
<span class="star">☆</span>
<span class="star">☆</span>
<span class="star">☆</span>

</div>

</div>

</div>

`;

const stars=
card.querySelectorAll(".star");

stars.forEach((star,index)=>{

star.addEventListener(
"click",
function(){

rateFood(
id,
index+1,
stars
);

}
);

});

gallery.appendChild(card);

overall.innerHTML+=`

<div class="card">

<h3>${item.foodname}</h3>

<p>${item.restaurant}</p>

<div class="gauge-wrap">

<div class="gauge">

<div
class="gauge-fill"
style="width:${avg*20}%">
</div>

</div>

<div class="gauge-text">

Overall Rating:
${avg.toFixed(1)}/5

</div>

</div>

</div>

`;

graph.innerHTML+=`

<div class="card">

<h3>${item.foodname}</h3>

<div class="gauge-wrap">

<div class="gauge">

<div
class="gauge-fill"
style="width:${avg*20}%">
</div>

</div>

<div class="gauge-text">

${Math.round(avg*20)}%
Audience Score

</div>

</div>

</div>

`;

});

});

}

function uploadUserFood(){

const imageFile=
document
.getElementById("userFoodImage")
.files[0];

const restaurant=
document
.getElementById("userRestaurant")
.value;

const foodname=
document
.getElementById("userFoodName")
.value;

const details=
document
.getElementById("userDetails")
.value;

if(
!imageFile ||
!restaurant ||
!foodname ||
!details
){

alert("Please fill all details");

return;

}

const reader=new FileReader();

reader.onload=function(){

const foodData={

image:reader.result,
restaurant,
foodname,
details,
uploadedBy:currentUser,
uploadedEmail:currentEmail,
time:Date.now()

};

db.ref("userUploads")
.push(foodData)
.then(()=>{

alert(
"Food uploaded successfully"
);

});

};

reader.readAsDataURL(imageFile);

}

function rateFood(
foodId,
rating,
stars
){

stars.forEach((star)=>{

star.innerHTML="☆";

star.classList.remove("active");

});

for(let i=0;i<rating;i++){

stars[i].innerHTML="★";

stars[i].classList.add("active");

}

db.ref("foods/"+foodId)
.once("value")
.then((snapshot)=>{

const item=snapshot.val();

if(!item.ratings){

item.ratings=[];

}

const alreadyRated=
item.ratings.find((r)=>{

return r.email===currentEmail;

});

if(alreadyRated){

alert(
"You already rated"
);

return;

}

item.ratings.push({

user:currentUser,
email:currentEmail,
rating:rating

});

db.ref("foods/"+foodId)
.set(item)
.then(()=>{

alert(
"Rating saved successfully"
);

});

});

}

</script>

</body>
</html>
