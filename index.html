<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Rating App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: black;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .upload-box {
      background: white;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 30px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .upload-box h2 {
      margin-bottom: 15px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 12px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      background: black;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .card-content {
      padding: 20px;
    }

    .stars {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .star {
      font-size: 28px;
      cursor: pointer;
      color: gray;
    }

    .star.active {
      color: gold;
    }

    .rating-text {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>

<header>
  <h1>🍔 Shift Platter</h1>
  <p>Rate your favorite photos and rate your likes to the photos</p>
</header>

<div class="container">

  <div id="loginPage" class="upload-box">
    <h2>👤 Login</h2>

    <input type="text" id="username" placeholder="Enter Username" />

    <div style="position:relative;">
      <input type="email" id="adminEmail" placeholder="Enter Email Address" style="padding-right:50px;" />
      <span onclick="toggleEmail Address()" style="position:absolute; right:15px; top:22px; cursor:pointer; font-size:14px; color:#555;">👁️</span>
    </div>

    <input type="email" id="viewerEmail" placeholder="Enter Your Email Address" />

    

    <button onclick="loginUser()">Enter Food Gallery</button>
  </div>

  

  

  <div id="adminPanel" class="upload-box" style="display:none;">
    <h2>➕ Admin Upload Panel</h2>
    <div style="font-size:48px; text-align:center; margin-bottom:20px;">➕</div>

    <input type="text" id="restaurant" placeholder="Restaurant Name" />

    <input type="text" id="food" placeholder="Food Name" />

    <textarea id="details" placeholder="Food Details"></textarea>

    <input type="file" id="imageUpload" accept="image/*" />

    <button onclick="uploadFood()">Upload Food</button>

    <div style="margin-top:20px; color:#555; font-size:14px;">
      📊 Only admin can upload images, food details, and access user rating analytics.
    </div>
  </div>

  <div id="adminTrackerPanel" class="upload-box" style="display:none;">
    <h2>📊 Admin Rating Tracker</h2>

    <div id="adminTrackerData">
      No user ratings yet.
    </div>
  </div>

  <div id="trackerSection" class="upload-box" style="display:none;">
    <h2>📈 Ratings Tracker</h2>
    <div id="trackerData"></div>
  </div>

  <div id="gallerySection" style="display:none;">
    <h2 style="margin-bottom:20px;">📸 Public Food Gallery</h2>

  <div class="gallery" id="gallery"></div>
  </div>

</div>

<script>
  const ADMIN_USERNAME = 'SHIFPLATTER';
  const ADMIN_EMAIL = 'SHIVIK@2030';

  let isAdmin = false;
  let allRatingsData = [];

  let uploadedFoods = [];
  let loggedInViewer = null;

  function togglePassword() {
    const passwordInput = document.getElementById('password');

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
    } else {
      passwordInput.type = 'password';
    }
  }

  function togglePassword() {
    const passwordInput = document.getElementById('password');

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
    } else {
      passwordInput.type = 'password';
    }
  }

  function loginUser() {
    const username = document.getElementById('username').value;
    const adminEmail = document.getElementById('adminEmail').value;
    const email = document.getElementById('viewerEmail').value;

    if (!email) {
      alert('Please enter your email address');
      return;
    }

    if (
      username.toUpperCase() === ADMIN_USERNAME &&
      adminEmail.toUpperCase() === ADMIN_EMAIL
    ) {
      isAdmin = true;
      document.getElementById('adminPanel').style.display = 'block';
      document.getElementById('adminTrackerPanel').style.display = 'block';
    }

    loggedInViewer = {
      name: username || 'User',
      email
    };

    document.getElementById('gallerySection').style.display = 'block';
    document.getElementById('trackerSection').style.display = 'block';
    document.getElementById('loginPage').style.display = 'none';

    renderGallery();
    renderPublicTracker();
  }

  

  

  function uploadFood() {
    const restaurant = document.getElementById('restaurant').value;
    const food = document.getElementById('food').value;
    const details = document.getElementById('details').value;
    const imageInput = document.getElementById('imageUpload');

    if (!imageInput.files[0]) {
      alert('Please upload an image');
      return;
    }

    const reader = new FileReader();

    reader.onload = function(e) {
      uploadedFoods.unshift({
        restaurant,
        food,
        details,
        imageUrl: e.target.result,
        ratings: []
      });

      renderGallery();
    };

    reader.readAsDataURL(imageInput.files[0]);
  }

  function renderPublicTracker() {
    const tracker = document.getElementById('trackerData');

    tracker.innerHTML = uploadedFoods
      .map(item => {
        const average = item.ratings.length
          ? (
              item.ratings.reduce((a, b) => a + b, 0) /
              item.ratings.length
            ).toFixed(1)
          : 0;

        return `
          <div style="background:white; padding:15px; border-radius:16px; margin-bottom:15px;">
            <h3>${item.food}</h3>
            <p>${item.restaurant}</p>

            <div style="margin-top:10px; background:#eee; border-radius:12px; overflow:hidden; height:18px;">
              <div style="width:${average * 20}%; background:black; height:18px;"></div>
            </div>

            <div class="rating-text">
              ⭐ Overall Rating: ${average}/5
            </div>

            <div class="rating-text">
              👥 Total Ratings: ${item.ratings.length}
            </div>
          </div>
        `;
      })
      .join('');
  }

  function renderAdminTracker() {
    const tracker = document.getElementById('adminTrackerData');

    if (!isAdmin) {
      tracker.innerHTML = '';
      return;
    }

    if (allRatingsData.length === 0) {
      tracker.innerHTML = 'No user ratings yet.';
      return;
    }

    tracker.innerHTML = allRatingsData
      .map(
        data => `
          <div style="background:#fff; padding:12px; border-radius:12px; margin-bottom:10px; border:1px solid #ddd;">
            <b>User:</b> ${data.user}<br>
            <b>Email:</b> ${data.email}<br>
            <b>Food:</b> ${data.food}<br>
            <b>Restaurant:</b> ${data.restaurant}<br>
            <b>Rating:</b> ⭐ ${data.rating}
          </div>
        `
      )
      .join('');
  }

  function renderGallery() {
    const gallery = document.getElementById('gallery');

    gallery.innerHTML = '';

    uploadedFoods.forEach((item, itemIndex) => {
      const averageRating = item.ratings.length
        ? (
            item.ratings.reduce((a, b) => a + b, 0) /
            item.ratings.length
          ).toFixed(1)
        : 'No Ratings';

      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <img src="${item.imageUrl}" onclick="alert('Restaurant: ${item.restaurant}

Food: ${item.food}

Details: ${item.details}')" style="cursor:pointer;" />

        <div class="card-content">
          <h2>${item.food}</h2>
          <h4>${item.restaurant}</h4>
          <p>${item.details}</p>

          <div class="rating-text">
            ⭐ Rate this food photo from 1 to 5 stars
          </div>

          <div class="stars">
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
          </div>

          <div class="rating-text" style="margin-top:15px;">
            📊 Overall Rating: <b>${averageRating}</b>
          </div>

          <div style="margin-top:12px; background:#eee; border-radius:12px; overflow:hidden; height:18px;">
            <div style="width:${averageRating === 'No Ratings' ? 0 : averageRating * 20}%; background:black; height:18px;"></div>
          </div>

          <div class="rating-text">
            👥 Total Ratings: <b>${item.ratings.length}</b>
          </div>

          <div class="rating-text">
            🔒 Other users cannot see who rated. Only overall ratings and statistics are visible.
          </div>

          ${isAdmin ? `
          <div class="rating-text" style="margin-top:10px; color:black;">
            🛠️ Admin Tracking Enabled
          </div>
          ` : ''}
          </div>
        </div>
      `;

      const stars = card.querySelectorAll('.star');

      stars.forEach((star, starIndex) => {
        star.addEventListener('click', () => {
          const existingRating = item.viewers.find(
            viewer => viewer.email === loggedInViewer.email
          );

          if (existingRating) {
            alert('You have already rated this food item');
            return;
          }

          item.ratings.push(starIndex + 1);

          item.viewers.push({
            name: loggedInViewer.name,
            email: loggedInViewer.email,
            rating: starIndex + 1
          });

          allRatingsData.push({
            food: item.food,
            restaurant: item.restaurant,
            user: loggedInViewer.name,
            email: loggedInViewer.email,
            rating: starIndex + 1
          });

          renderGallery();

          if (isAdmin) {
            renderAdminTracker();
          }
        });
      });

      gallery.appendChild(card);
    });
  }
</script>

</body>
</html>
