<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShiftPlatter</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

body{
  margin:0;
  padding:0;
  background:#f5f5f5;
  font-family:Arial,sans-serif;
}

.container{
  max-width:900px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:15px;
  border-radius:20px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

input{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #ddd;
  margin-top:12px;
  box-sizing:border-box;
}

button{
  padding:14px;
  border:none;
  border-radius:14px;
  background:black;
  color:white;
  cursor:pointer;
}

.full-btn{
  width:100%;
  margin-top:15px;
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.tab-btn{
  flex:1;
  padding:12px;
  border:none;
  border-radius:14px;
  background:#e5e5e5;
  font-weight:bold;
}

.active-tab{
  background:black;
  color:white;
}

.hidden{
  display:none;
}

.food-card{
  display:flex;
  gap:15px;
}

.food-image{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:14px;
  cursor:pointer;
  flex-shrink:0;
}

.stars{
  display:flex;
  gap:5px;
  margin-top:10px;
}

.star{
  font-size:28px;
  color:#ccc;
  cursor:pointer;
}

.star.active{
  color:gold;
}

.rating-bar{
  width:100%;
  height:28px;
  background:#ddd;
  border-radius:30px;
  overflow:hidden;
  margin-top:15px;
}

.rating-fill{
  height:100%;
  background:black;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:14px;
  font-weight:bold;
}

.loader{
  text-align:center;
  padding:30px;
}

</style>

</head>
<body>

<div class="container">

  <!-- LOGIN -->
  <div class="card" id="loginPage">

    <h1>ShiftPlatter</h1>

    <p>
      Rate your favorite food photos
    </p>

    <input
      type="text"
      id="username"
      placeholder="Enter Username"
    >

    <input
      type="email"
      id="email"
      placeholder="Enter Email Address"
    >

    <button
      class="full-btn"
      onclick="loginUser()">
      Continue
    </button>

  </div>

  <!-- MAIN -->
  <div id="mainApp" class="hidden">

    <div class="tabs">

      <button
        class="tab-btn active-tab"
        onclick="showTab('galleryTab',this)">
        Food Gallery
      </button>

      <button
        class="tab-btn"
        onclick="showTab('ratingsTab',this)">
        Overall Ratings
      </button>

      <button
        class="tab-btn"
        onclick="showTab('graphTab',this)">
        Graph
      </button>

    </div>

    <!-- GALLERY -->
    <div id="galleryTab">

      <div id="gallery"></div>

    </div>

    <!-- RATINGS -->
    <div id="ratingsTab" class="hidden">

      <div id="overallRatings"></div>

    </div>

    <!-- GRAPH -->
    <div id="graphTab" class="hidden">

      <div id="graphContainer"></div>

    </div>

  </div>

</div>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyCQ0YG2sulip67LaN7SBm4Bw6WduRchJTE",
    authDomain: "shifplatter-e0449.firebaseapp.com",
    databaseURL: "https://shifplatter-e0449-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shifplatter-e0449",
    storageBucket: "shifplatter-e0449.firebasestorage.app",
    messagingSenderId: "873786528833",
    appId: "1:873786528833:web:e72394fec2ce9f8b52a2c0"
  };

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let currentUser = "";
let currentEmail = "";

// LOGIN
function loginUser(){

  const username =
    document.getElementById("username")
    .value.trim();

  const email =
    document.getElementById("email")
    .value.trim();

  if(!username || !email){

    alert("Please enter details");

    return;

  }

  // ADMIN
  if(
    username.toUpperCase()==="SHIFPLATTER" &&
    email.toUpperCase()==="SHIVIK@2030"
  ){

    window.location.href="admin.html";

    return;

  }

  currentUser=username;
  currentEmail=email;

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("mainApp")
    .classList.remove("hidden");

  loadFoods();

}

// TABS
function showTab(tabId,btn){

  document
    .querySelectorAll(
      "#galleryTab,#ratingsTab,#graphTab"
    )
    .forEach((tab)=>{

      tab.classList.add("hidden");

    });

  document
    .getElementById(tabId)
    .classList.remove("hidden");

  document
    .querySelectorAll(".tab-btn")
    .forEach((b)=>{

      b.classList.remove("active-tab");

    });

  btn.classList.add("active-tab");

}

// LOAD FOODS
function loadFoods(){

  const gallery =
    document.getElementById("gallery");

  const overall =
    document.getElementById("overallRatings");

  const graph =
    document.getElementById("graphContainer");

  gallery.innerHTML =
    '<div class="loader">Loading...</div>';

  db.ref("foods")
  .limitToLast(20)
  .once("value")
  .then((snapshot)=>{

    const data = snapshot.val();

    gallery.innerHTML="";
    overall.innerHTML="";
    graph.innerHTML="";

    if(!data){

      gallery.innerHTML=`
        <div class="card">
          No foods uploaded yet
        </div>
      `;

      return;

    }

    Object.keys(data)
    .reverse()
    .forEach((id)=>{

      const item=data[id];

      if(!item.ratings){

        item.ratings=[];

      }

      let total=0;

      item.ratings.forEach((r)=>{

        total+=Number(r.rating||0);

      });

      let avg=0;

      if(item.ratings.length>0){

        avg=
          total/item.ratings.length;

      }

      // GALLERY
      const card=
        document.createElement("div");

      card.className="card";

      card.innerHTML=`

        <div class="food-card">

          <img
            class="food-image"
            src="${item.image}"
            loading="lazy"
            onclick="window.open('${item.image}')"
          >

          <div>

            <h3>${item.foodname}</h3>

            <p>
              <b>${item.restaurant}</b>
            </p>

            <p>${item.details}</p>

            <div class="stars">

              <span class="star">☆</span>
              <span class="star">☆</span>
              <span class="star">☆</span>
              <span class="star">☆</span>
              <span class="star">☆</span>

            </div>

          </div>

        </div>

      `;

      const stars=
        card.querySelectorAll(".star");

      stars.forEach((star,index)=>{

        star.addEventListener(
          "click",
          function(){

            rateFood(
              id,
              index+1,
              stars
            );

          }
        );

      });

      gallery.appendChild(card);

      // OVERALL
      overall.innerHTML+=`

        <div class="card">

          <div class="food-card">

            <img
              class="food-image"
              src="${item.image}"
              loading="lazy"
            >

            <div>

              <h3>${item.foodname}</h3>

              <p>${item.restaurant}</p>

              <h2>
                ⭐ ${avg.toFixed(1)}/5
              </h2>

              <p>
                ${item.ratings.length}
                Ratings
              </p>

            </div>

          </div>

        </div>

      `;

      // GRAPH
      graph.innerHTML+=`

        <div class="card">

          <h3>${item.foodname}</h3>

          <p>${item.restaurant}</p>

          <div class="rating-bar">

            <div
              class="rating-fill"
              style="width:${avg*20}%">

              ${avg.toFixed(1)}/5

            </div>

          </div>

        </div>

      `;

    });

  });

}

// RATE
function rateFood(foodId,rating,stars){

  stars.forEach((star)=>{

    star.innerHTML="☆";

    star.classList.remove("active");

  });

  for(let i=0;i<rating;i++){

    stars[i].innerHTML="★";

    stars[i].classList.add("active");

  }

  db.ref("foods/"+foodId)
  .once("value")
  .then((snapshot)=>{

    const item=snapshot.val();

    if(!item.ratings){

      item.ratings=[];

    }

    const alreadyRated=
      item.ratings.find((r)=>{

        return r.email===currentEmail;

      });

    if(alreadyRated){

      alert(
        "You already rated this food"
      );

      return;

    }

    item.ratings.push({

      user:currentUser,
      email:currentEmail,
      rating:rating

    });

    db.ref("foods/"+foodId)
    .set(item)
    .then(()=>{

      alert(
        "Rating saved successfully"
      );

    });

  });

}

</script>

</body>
</html>
