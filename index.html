<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShifPlatter</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{

background:
linear-gradient(
rgba(0,0,0,0.60),
rgba(0,0,0,0.60)
),
url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1600&auto=format&fit=crop");

background-size:cover;
background-position:center;
background-attachment:fixed;

min-height:100vh;
color:white;

}

.container{
max-width:1200px;
margin:auto;
padding:15px;
}

.glass{
background:rgba(255,255,255,0.10);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,0.15);
}

.hidden{
display:none;
}

.login-card{
padding:30px;
border-radius:30px;
margin-top:40px;
text-align:center;
}

.logo{
width:120px;
height:120px;
border-radius:20px;
background:white;
padding:10px;
object-fit:contain;
}

.main-title{
font-size:42px;
font-weight:900;
margin-top:15px;
}

.sub-title{
margin-top:10px;
color:#ddd;
}

input,
textarea{

width:100%;
padding:16px;
margin-top:15px;
border:none;
border-radius:18px;
font-size:15px;

}

textarea{
height:120px;
resize:none;
}

.main-btn{

width:100%;
padding:16px;
margin-top:15px;

border:none;
border-radius:18px;

background:#FFD700;
color:black;

font-weight:bold;
cursor:pointer;

}

.topbar{

display:flex;
align-items:center;
gap:15px;

padding:15px;
border-radius:25px;

margin-bottom:20px;

}

.top-logo{
width:60px;
height:60px;
border-radius:15px;
background:white;
padding:5px;
}

.top-title{
font-size:26px;
font-weight:bold;
}

.tabs{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.tab-btn{

flex:1;

padding:15px;

border:none;
border-radius:16px;

background:rgba(255,255,255,0.15);
color:white;

cursor:pointer;
font-weight:bold;

}

.active-tab{
background:#FFD700;
color:black;
}

.card{

padding:20px;
border-radius:25px;

margin-bottom:20px;

}

.food-image{

width:100%;
height:320px;

object-fit:cover;
border-radius:20px;

cursor:pointer;

}

.food-title{

font-size:28px;
font-weight:bold;
margin-top:15px;

}

.food-sub{

margin-top:5px;
color:#ddd;

}

.food-desc{

margin-top:10px;
line-height:1.6;

}

.stars{

display:flex;
gap:10px;

margin-top:15px;

}

.star{

font-size:50px;
cursor:pointer;
color:#ccc;

transition:.2s;

}

.star:hover{
transform:scale(1.1);
}

.active-star{

color:#FFD700;

text-shadow:
0 0 10px #FFD700,
0 0 20px #FFD700;

}

.comment-btn{

padding:12px 15px;
border:none;
border-radius:14px;

background:#FFD700;
color:black;

font-weight:bold;
cursor:pointer;

margin-top:12px;
margin-right:10px;

}

.gauge{

width:100%;
height:18px;

background:#333;

border-radius:20px;

overflow:hidden;

margin-top:15px;

}

.gauge-fill{

height:100%;

background:
linear-gradient(
90deg,
#00c853,
#64dd17
);

}

.comment-box{

margin-top:15px;

padding:15px;

border-radius:15px;

background:rgba(255,255,255,0.10);

}

.comment-item{

padding:10px;
border-bottom:1px solid rgba(255,255,255,0.1);

}

.leaderboard-container{

display:flex;
justify-content:center;
gap:20px;

flex-wrap:wrap;

}

.leader-card{

width:280px;

padding:20px;

border-radius:25px;

text-align:center;

background:rgba(255,255,255,0.15);

}

.leader-image{

width:150px;
height:150px;

border-radius:50%;
object-fit:cover;

}

.toast{

position:fixed;

bottom:20px;
left:50%;

transform:translateX(-50%);

background:#FFD700;
color:black;

padding:15px 25px;

border-radius:15px;

font-weight:bold;

z-index:9999;

}

@media(max-width:768px){

.food-image{
height:220px;
}

.star{
font-size:38px;
}

.main-title{
font-size:34px;
}

}

</style>

</head>
<body>
<div class="container">

<!-- LOGIN PAGE -->

<div id="loginPage" class="login-card glass">

<img src="logo.png" class="logo">

<div class="main-title">
ShifPlatter
</div>

<div class="sub-title">
Login using your Instagram username
</div>

<input
type="text"
id="username"
placeholder="@instagram_username"
>

<input
type="text"
id="name"
placeholder="Your Name"
>

<button
class="main-btn"
onclick="loginUser()">
Continue
</button>

</div>

<!-- MAIN APP -->

<div id="mainApp" class="hidden">

<!-- TOP BAR -->

<div class="topbar glass">

<img
src="logo.png"
class="top-logo"
>

<div>

<div class="top-title">
ShifPlatter
</div>

<div style="font-size:13px;color:#ddd;">
Community Food Ratings
</div>

</div>

</div>

<!-- TABS -->

<div class="tabs">

<button
class="tab-btn active-tab"
onclick="showTab('galleryTab',this)">
Gallery
</button>

<button
class="tab-btn"
onclick="showTab('ratingsTab',this)">
Overall Ratings
</button>

<button
class="tab-btn"
onclick="showTab('uploadTab',this)">
Upload
</button>

<button
class="tab-btn"
onclick="showTab('leaderboardTab',this)">
Leaderboard
</button>

</div>

<!-- GALLERY TAB -->

<div id="galleryTab">

<div id="gallery"></div>

</div>

<!-- RATINGS TAB -->

<div
id="ratingsTab"
class="hidden">

<div id="ratingsContainer"></div>

</div>

<!-- UPLOAD TAB -->

<div
id="uploadTab"
class="hidden">

<div class="card glass">

<h2>
📸 Upload Food Photo
</h2>

<input
type="file"
id="foodImage"
accept="image/*"
>

<input
type="text"
id="restaurant"
placeholder="Restaurant / Cafe Name"
>

<input
type="text"
id="foodname"
placeholder="Food Name"
>

<textarea
id="details"
placeholder="Food Details">
</textarea>

<button
class="main-btn"
onclick="uploadFood()">
Upload Photo
</button>

<p style="margin-top:15px;color:#ddd;">

This upload goes ONLY to Admin User Photos.

It will NOT appear in the gallery automatically.

</p>

</div>

</div>

<!-- LEADERBOARD TAB -->

<div
id="leaderboardTab"
class="hidden">

<div class="card glass">

<h1 style="
text-align:center;
margin-bottom:25px;
">

🏆 Top Rated Foods

</h1>

<div
id="leaderboardContainer"
class="leaderboard-container">

</div>

</div>

</div>

</div>

</div>
  <script>

const firebaseConfig = {

apiKey: "YOUR_API_KEY",
authDomain: "YOUR_AUTH_DOMAIN",
databaseURL: "YOUR_DATABASE_URL",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_STORAGE_BUCKET",
messagingSenderId: "YOUR_MESSAGING_ID",
appId: "YOUR_APP_ID"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let currentUser = "";
let currentName = "";

const userRatings = {};

/* LOGIN */

function loginUser(){

const username =
document.getElementById("username")
.value.trim();

const name =
document.getElementById("name")
.value.trim();

if(!username || !name){

alert("Please enter all details");

return;

}

currentUser = username;
currentName = name;

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("mainApp")
.classList.remove("hidden");

loadFoods();

}

/* TAB SWITCHING */

function showTab(tabId,btn){

document
.querySelectorAll(
"#galleryTab,#ratingsTab,#uploadTab,#leaderboardTab"
)
.forEach(tab=>{

tab.classList.add("hidden");

});

document
.getElementById(tabId)
.classList.remove("hidden");

document
.querySelectorAll(".tab-btn")
.forEach(button=>{

button.classList.remove("active-tab");

});

btn.classList.add("active-tab");

}

/* TOAST */

function showToast(message){

const toast =
document.createElement("div");

toast.className = "toast";

toast.innerHTML = message;

document.body.appendChild(toast);

setTimeout(()=>{

toast.remove();

},2000);

}
/* LOAD FOODS */

function loadFoods(){

db.ref("foods").on("value",(snapshot)=>{

const data = snapshot.val();

const gallery =
document.getElementById("gallery");

const ratings =
document.getElementById("ratingsContainer");

gallery.innerHTML = "";
ratings.innerHTML = "";

if(!data){

gallery.innerHTML = `
<div class="card glass">
<h2>No foods uploaded yet</h2>
</div>
`;

return;

}

loadLeaderboard(data);

Object.keys(data).reverse().forEach((foodId)=>{

const item = data[foodId];

if(!item.ratings){
item.ratings = [];
}

let totalRating = 0;

item.ratings.forEach((r)=>{

totalRating += Number(r.rating || 0);

});

const averageRating =
item.ratings.length > 0
? totalRating / item.ratings.length
: 0;

/* GALLERY CARD */

gallery.innerHTML += `

<div class="card glass">

<img
src="${item.image}"
class="food-image"
onclick="openImage('${item.image}')"
>

<div class="food-title">
${item.foodname}
</div>

<div class="food-sub">
${item.restaurant}
</div>

<div class="food-desc">
${item.details}
</div>

<div class="stars">

${[1,2,3,4,5].map(star=>`

<span
class="star ${userRatings[foodId] >= star ? 'active-star' : ''}"
onclick="rateFood(this,'${foodId}',${star})">
★
</span>

`).join("")}

</div>

<div style="margin-top:15px;">

<button
class="main-btn"
onclick="showComments('${foodId}')">
View Comments
</button>

</div>

<div
id="comments-${foodId}"
style="display:none;margin-top:15px;">
</div>

<div style="margin-top:15px;">

<textarea
id="commentInput-${foodId}"
placeholder="Write a comment">
</textarea>

<button
class="main-btn"
onclick="postComment('${foodId}')">
Post Comment
</button>

</div>

</div>

`;

/* RATINGS PAGE */

ratings.innerHTML += `

<div class="card glass">

<h2>
${item.foodname}
</h2>

<p>
${item.restaurant}
</p>

<div class="gauge">

<div
class="gauge-fill"
style="width:${averageRating*20}%">
</div>

</div>

<div style="
margin-top:10px;
font-size:18px;
font-weight:bold;
">

⭐ ${averageRating.toFixed(1)}/5

</div>

<div style="
margin-top:5px;
color:#ddd;
">

${item.ratings.length}
Ratings Received

</div>

</div>

`;

});

});

}

/* FULL IMAGE VIEW */

function openImage(imageUrl){

window.open(
imageUrl,
"_blank"
);

}
/* RATE FOOD */

function rateFood(el,foodId,rating){

userRatings[foodId] = rating;

const stars =
el.parentElement.querySelectorAll(".star");

stars.forEach((star,index)=>{

if(index < rating){

star.classList.add("active-star");

}else{

star.classList.remove("active-star");

}

});

db.ref("foods/"+foodId+"/ratings")
.once("value")
.then((snapshot)=>{

let ratings =
snapshot.val() || [];

ratings.push({

user:currentUser,
name:currentName,
rating:rating,
time:Date.now()

});

return db
.ref("foods/"+foodId+"/ratings")
.set(ratings);

})
.then(()=>{

showToast(
"⭐ Rating Saved"
);

});

}

/* POST COMMENT */

function postComment(foodId){

const commentBox =
document.getElementById(
"commentInput-"+foodId
);

const comment =
commentBox.value.trim();

if(!comment){

alert("Enter comment");

return;

}

db.ref(
"foods/"+foodId+"/comments"
)
.push({

user:currentName,
username:currentUser,
comment:comment,
time:Date.now()

})
.then(()=>{

commentBox.value = "";

showToast(
"💬 Comment Posted"
);

showComments(foodId);

});

}

/* SHOW COMMENTS */

function showComments(foodId){

const commentsDiv =
document.getElementById(
"comments-"+foodId
);

if(
commentsDiv.style.display==="none"
){

commentsDiv.style.display="block";

}else{

commentsDiv.style.display="none";

return;

}

db.ref(
"foods/"+foodId+"/comments"
)
.once("value")
.then((snapshot)=>{

const comments =
snapshot.val();

if(!comments){

commentsDiv.innerHTML = `

<div class="card glass">
No comments yet
</div>

`;

return;

}

let html = "";

Object.keys(comments)
.reverse()
.forEach((id)=>{

const item =
comments[id];

html += `

<div
style="
padding:12px;
border-radius:14px;
margin-bottom:10px;
background:rgba(255,255,255,0.08);
">

<b>
${item.user}
</b>

<div
style="
margin-top:5px;
font-size:14px;
">

${item.comment}

</div>

</div>

`;

});

commentsDiv.innerHTML = html;

});

}
  /* USER UPLOAD */

/*
IMPORTANT:

User uploads DO NOT go to:

foods

They go ONLY to:

userUploads

Admin will see them in:
Admin → User Photos tab

Users will NOT see uploaded photos
inside Gallery.
*/

function uploadFood(){

const file =
document.getElementById("foodImage")
.files[0];

const restaurant =
document.getElementById("restaurant")
.value.trim();

const foodname =
document.getElementById("foodname")
.value.trim();

const details =
document.getElementById("details")
.value.trim();

if(
!file ||
!restaurant ||
!foodname
){

alert(
"Please complete all details"
);

return;

}

const reader =
new FileReader();

reader.onload = function(e){

const uploadData = {

restaurant:restaurant,

foodname:foodname,

details:details,

image:e.target.result,

uploadedBy:currentUser,

uploadedName:currentName,

time:Date.now()

};

/* SAVE ONLY HERE */

db.ref("userUploads")
.push(uploadData)
.then(()=>{

showToast(
"📸 Photo Sent To Admin"
);

/* CLEAR FORM */

document
.getElementById("foodImage")
.value="";

document
.getElementById("restaurant")
.value="";

document
.getElementById("foodname")
.value="";

document
.getElementById("details")
.value="";

});

};

reader.readAsDataURL(file);

}
