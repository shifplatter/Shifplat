<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Food Rating App</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f4f4;
      color: #222;
    }

    header {
      background: black;
      color: white;
      padding: 20px;
      text-align: center;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 20px;
    }

    .upload-box {
      background: white;
      padding: 20px;
      border-radius: 20px;
      margin-bottom: 30px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .upload-box h2 {
      margin-bottom: 15px;
    }

    input, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 12px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      background: black;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    .card img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .card-content {
      padding: 20px;
    }

    .stars {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .star {
      font-size: 28px;
      cursor: pointer;
      color: gray;
    }

    .star.active {
      color: gold;
    }

    .rating-text {
      margin-top: 10px;
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>

<header>
  <h1>🍔 Shift Platter</h1>
  <p>Rate your favorite photos and rate your likes to the photos</p>
</header>

<div class="container">

  <div id="loginPage" class="upload-box">
    <h2>👤 User Login</h2>

    <input type="text" id="viewerName" placeholder="Enter Your Name" />

    <input type="email" id="viewerEmail" placeholder="Enter Your Email" />

    <button onclick="loginUser()">Enter Food Gallery</button>
  </div>

  

  

  <div id="gallerySection" style="display:none;">
    <h2 style="margin-bottom:20px;">📸 Public Food Gallery</h2>

  <div class="gallery" id="gallery"></div>
  </div>

</div>

<script>
  let uploadedFoods = [
    {
      restaurant: 'Spice Garden',
      food: 'Chicken Biryani',
      details: 'Traditional spicy chicken biryani served hot.',
      imageUrl: 'https://images.unsplash.com/photo-1701579231305-d84d8af9a3fd?q=80&w=1200&auto=format&fit=crop',
      ratings: [5,4,5,4]
    },
    {
      restaurant: 'Ocean Grill',
      food: 'Grilled Fish',
      details: 'Fresh grilled fish with lemon butter sauce.',
      imageUrl: 'https://images.unsplash.com/photo-1615141982883-c7ad0e69fd62?q=80&w=1200&auto=format&fit=crop',
      ratings: [4,5,5]
    }
  ];
  let loggedInViewer = null;

  function togglePassword() {
    const passwordInput = document.getElementById('password');

    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
    } else {
      passwordInput.type = 'password';
    }
  }

  function loginUser() {
    const name = document.getElementById('viewerName').value;
    const email = document.getElementById('viewerEmail').value;

    if (!name || !email) {
      alert('Please enter name and email');
      return;
    }

    loggedInViewer = {
      name,
      email
    };

    document.getElementById('gallerySection').style.display = 'block';
    document.getElementById('loginPage').style.display = 'none';

    renderGallery();
  }

  

  

  function renderGallery() {
    const gallery = document.getElementById('gallery');

    gallery.innerHTML = '';

    uploadedFoods.forEach((item, itemIndex) => {
      const averageRating = item.ratings.length
        ? (
            item.ratings.reduce((a, b) => a + b, 0) /
            item.ratings.length
          ).toFixed(1)
        : 'No Ratings';

      const card = document.createElement('div');
      card.className = 'card';

      card.innerHTML = `
        <img src="${item.imageUrl}" onclick="alert('Restaurant: ${item.restaurant}

Food: ${item.food}

Details: ${item.details}')" style="cursor:pointer;" />

        <div class="card-content">
          <h2>${item.food}</h2>
          <h4>${item.restaurant}</h4>
          <p>${item.details}</p>

          <div class="rating-text">
            ⭐ Rate this food photo from 1 to 5 stars
          </div>

          <div class="stars">
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
            <span class="star">★</span>
          </div>

          <div class="rating-text" style="margin-top:15px;">
            📊 Average Rating: <b>${averageRating}</b>
          </div>

          <div style="margin-top:12px; background:#eee; border-radius:12px; overflow:hidden; height:18px;">
            <div style="width:${averageRating === 'No Ratings' ? 0 : averageRating * 20}%; background:black; height:18px;"></div>
          </div>

          <div class="rating-text">
            👥 Total Ratings: <b>${item.ratings.length}</b>
          </div>

          <div class="rating-text">
            🔒 User identities are hidden. Only rating statistics are visible.
          </div>
        </div>
      `;

      const stars = card.querySelectorAll('.star');

      stars.forEach((star, starIndex) => {
        star.addEventListener('click', () => {
          item.ratings.push(starIndex + 1);

          item.viewers.push({
            name: loggedInViewer.name,
            email: loggedInViewer.email,
            rating: starIndex + 1
          });

          renderGallery();
        });
      });

      gallery.appendChild(card);
    });
  }
</script>

</body>
</html>
