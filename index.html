<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShifPlatter Rating</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

body{
margin:0;
padding:0;
font-family:Arial,sans-serif;
background:#f5f5f5;
}

.container{
max-width:900px;
margin:auto;
padding:15px;
}

.card{
background:white;
padding:15px;
border-radius:18px;
margin-bottom:18px;
box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

input,textarea{
width:100%;
padding:14px;
margin-top:12px;
border-radius:14px;
border:1px solid #ddd;
box-sizing:border-box;
font-size:15px;
}

button{
border:none;
padding:14px;
border-radius:14px;
cursor:pointer;
}

.full-btn{
width:100%;
background:black;
color:white;
margin-top:15px;
font-weight:bold;
}

.tabs{
display:flex;
gap:8px;
margin-bottom:20px;
overflow:auto;
}

.tab-btn{
flex:1;
background:#e5e5e5;
font-weight:bold;
white-space:nowrap;
padding:12px;
}

.active-tab{
background:black;
color:white;
}

.hidden{
display:none;
}

.food-card{
display:flex;
flex-direction:column;
}

.food-image{
width:100%;
height:260px;
object-fit:cover;
border-radius:18px;
cursor:pointer;
margin-bottom:12px;
transition:0.3s;
}

.food-image:hover{
transform:scale(1.01);
}

.stars{
display:flex;
gap:5px;
margin-top:10px;
}

.star{
font-size:30px;
cursor:pointer;
color:#ccc;
transition:0.2s;
}

.star.active{
color:gold;
}

.gauge-wrap{
margin-top:15px;
}

.gauge{
width:100%;
height:18px;
background:#ddd;
border-radius:30px;
overflow:hidden;
}

.gauge-fill{
height:100%;
background:linear-gradient(
90deg,
#00c853,
#64dd17
);
}

.gauge-text{
margin-top:8px;
font-size:14px;
font-weight:bold;
}

.comment{
background:#fafafa;
padding:10px;
border-radius:12px;
margin-top:10px;
border:1px solid #eee;
}

.comment-actions{
display:flex;
gap:10px;
margin-top:15px;
}

.comment-actions button{
flex:1;
}

.top3-wrap{
display:flex;
justify-content:center;
align-items:flex-end;
gap:15px;
margin-top:25px;
margin-bottom:35px;
flex-wrap:wrap;
}

.podium{
width:120px;
border-radius:25px;
text-align:center;
padding:15px;
position:relative;
box-shadow:0 4px 15px rgba(0,0,0,0.08);
transition:0.3s;
}

.podium:hover{
transform:translateY(-5px);
}

.first{
background:#ffe082;
height:240px;
}

.second{
background:#eeeeee;
height:190px;
}

.third{
background:#ffccbc;
height:170px;
}

.rank-avatar{
width:80px;
height:80px;
border-radius:50%;
object-fit:cover;
margin-top:-50px;
border:5px solid white;
cursor:pointer;
box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.crown{
position:absolute;
top:-35px;
right:35px;
font-size:40px;
}

.rank-name{
font-size:18px;
font-weight:bold;
margin-top:10px;
}

.rank-score{
font-size:18px;
margin-top:10px;
font-weight:bold;
}

.rank-number{
font-size:70px;
font-weight:bold;
margin-top:15px;
opacity:0.25;
}

@media(max-width:768px){

.top3-wrap{
gap:10px;
}

.podium{
width:100px;
}

.rank-avatar{
width:65px;
height:65px;
}

.rank-number{
font-size:55px;
}

}

</style>

</head>
<body>

<div class="container">

<div class="card" id="loginPage">

<h1>ShifPlatter Rating</h1>

<p>Food Community Rating Platform</p>

<input
type="text"
id="username"
placeholder="Enter Username"
>

<input
type="email"
id="email"
placeholder="Enter Email Address"
>

<button
class="full-btn"
onclick="loginUser()">
Continue
</button>

</div>

<div id="mainApp" class="hidden">

<div class="tabs">

<button
class="tab-btn active-tab"
onclick="showTab('galleryTab',this)">
Gallery
</button>

<button
class="tab-btn"
onclick="showTab('ratingsTab',this)">
Overall Ratings
</button>

<button
class="tab-btn"
onclick="showTab('leaderboardTab',this)">
Leaderboard
</button>

<button
class="tab-btn"
onclick="showTab('uploadTab',this)">
Upload Your Image
</button>

</div>

<div id="galleryTab">
<div id="gallery"></div>
</div>

<div id="ratingsTab" class="hidden">
<div id="overallRatings"></div>
</div>

<div id="leaderboardTab" class="hidden">
<div id="leaderboard"></div>
</div>

<div id="uploadTab" class="hidden">

<div class="card">

<h2>Upload Your Food</h2>

<input
type="file"
id="userFoodImage"
accept="image/*"
>

<input
type="text"
id="userRestaurant"
placeholder="Restaurant / Cafe Name"
>

<input
type="text"
id="userFoodName"
placeholder="Food Name"
>

<textarea
id="userDetails"
placeholder="Food Details">
</textarea>

<button
class="full-btn"
onclick="uploadUserFood()">
Upload Food
</button>

</div>

</div>

</div>

</div>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyCQ0YG2sulip67LaN7SBm4Bw6WduRchJTE",
    authDomain: "shifplatter-e0449.firebaseapp.com",
    databaseURL: "https://shifplatter-e0449-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shifplatter-e0449",
    storageBucket: "shifplatter-e0449.firebasestorage.app",
    messagingSenderId: "873786528833",
    appId: "1:873786528833:web:e72394fec2ce9f8b52a2c0"
  };

firebase.initializeApp(firebaseConfig);

const db=firebase.database();

let currentUser="";
let currentEmail="";

window.onload=function(){

const savedUser=
localStorage.getItem("shiftUser");

const savedEmail=
localStorage.getItem("shiftEmail");

if(savedUser && savedEmail){

currentUser=savedUser;
currentEmail=savedEmail;

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("mainApp")
.classList.remove("hidden");

loadFoods();

}

};

function loginUser(){

const username=
document
.getElementById("username")
.value.trim();

const email=
document
.getElementById("email")
.value.trim();

if(!username || !email){

alert("Please enter details");

return;

}

if(
username.toUpperCase()==="SHIFPLATTER" &&
email.toUpperCase()==="SHIVIK@2030"
){

window.location.href="admin.html";

return;

}

currentUser=username;
currentEmail=email;

localStorage.setItem(
"shiftUser",
username
);

localStorage.setItem(
"shiftEmail",
email
);

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("mainApp")
.classList.remove("hidden");

loadFoods();

}

function showTab(tabId,btn){

document
.querySelectorAll(
"#galleryTab,#ratingsTab,#leaderboardTab,#uploadTab"
)
.forEach((tab)=>{

tab.classList.add("hidden");

});

document
.getElementById(tabId)
.classList.remove("hidden");

document
.querySelectorAll(".tab-btn")
.forEach((b)=>{

b.classList.remove("active-tab");

});

btn.classList.add("active-tab");

}

function loadFoods(){

const gallery=
document.getElementById("gallery");

const overall=
document.getElementById("overallRatings");

const leaderboard=
document.getElementById("leaderboard");

gallery.innerHTML="";
overall.innerHTML="";
leaderboard.innerHTML="";

db.ref("foods")
.limitToLast(50)
.once("value")
.then((snapshot)=>{

const data=snapshot.val();

if(!data){

gallery.innerHTML=`
<div class="card">
No foods uploaded yet
</div>
`;

return;

}

const foods=[];

Object.keys(data).forEach((id)=>{

const item=data[id];

if(!item.ratings){

item.ratings=[];

}

let total=0;

item.ratings.forEach((r)=>{

total+=Number(r.rating||0);

});

let avg=0;

if(item.ratings.length>0){

avg=
total/item.ratings.length;

}

foods.push({
id,
avg,
item
});

});

foods.sort((a,b)=>b.avg-a.avg);

foods.forEach((food,index)=>{

const id=food.id;
const item=food.item;
const avg=food.avg;

const card=
document.createElement("div");

card.className="card";

card.innerHTML=`

<div class="food-card">

<img
class="food-image"
src="${item.image}"
loading="lazy"
onclick="openImage('${item.image}')"
>

<h2>${item.foodname}</h2>

<p>
<b>${item.restaurant}</b>
</p>

<p>${item.details}</p>

<div class="stars">

<span class="star">☆</span>
<span class="star">☆</span>
<span class="star">☆</span>
<span class="star">☆</span>
<span class="star">☆</span>

</div>

<div class="comment-actions">

<button
class="full-btn"
onclick="toggleCommentBox('${id}')">
Comment
</button>

<button
class="full-btn"
onclick="toggleComments('${id}')">
View Comments
</button>

</div>

<div
id="commentBox-${id}"
class="hidden">

<textarea
id="comment-${id}"
placeholder="Write your review...">
</textarea>

<button
class="full-btn"
onclick="addComment('${id}')">
Post
</button>

</div>

<div
id="comments-${id}"
class="hidden">
</div>

</div>

`;

const stars=
card.querySelectorAll(".star");

stars.forEach((star,index)=>{

star.addEventListener(
"click",
function(){

rateFood(
id,
index+1,
stars
);

}
);

});

gallery.appendChild(card);

overall.innerHTML+=`

<div class="card">

<h3>${item.foodname}</h3>

<p>${item.restaurant}</p>

<div class="gauge-wrap">

<div class="gauge">

<div
class="gauge-fill"
style="width:${avg*20}%">
</div>

</div>

<div class="gauge-text">

${avg.toFixed(1)}/5
Overall Audience Rating

</div>

</div>

</div>

`;

if(index===0){

leaderboard.innerHTML+=`

<div class="card">

<h1 style="
text-align:center;
margin-bottom:25px;
font-size:32px;
">
🏆 Top Food Leaderboard
</h1>

<div class="top3-wrap">

${
foods[1]
? `
<div class="podium second">

<img
class="rank-avatar"
src="${foods[1].item.image}"
onclick="openImage('${foods[1].item.image}')"
>

<div class="rank-name">
${foods[1].item.foodname}
</div>

<div class="rank-score">
⭐ ${foods[1].avg.toFixed(1)}
</div>

<div class="rank-number">
2
</div>

</div>
`
:
""
}

${
foods[0]
? `
<div class="podium first">

<div class="crown">
👑
</div>

<img
class="rank-avatar"
src="${foods[0].item.image}"
onclick="openImage('${foods[0].item.image}')"
>

<div class="rank-name">
${foods[0].item.foodname}
</div>

<div class="rank-score">
⭐ ${foods[0].avg.toFixed(1)}
</div>

<div class="rank-number">
1
</div>

</div>
`
:
""
}

${
foods[2]
? `
<div class="podium third">

<img
class="rank-avatar"
src="${foods[2].item.image}"
onclick="openImage('${foods[2].item.image}')"
>

<div class="rank-name">
${foods[2].item.foodname}
</div>

<div class="rank-score">
⭐ ${foods[2].avg.toFixed(1)}
</div>

<div class="rank-number">
3
</div>

</div>
`
:
""
}

</div>

</div>

`;

}

const commentsDiv=
card.querySelector(
"#comments-"+id
);

if(item.comments){

Object.values(item.comments)
.reverse()
.forEach((c)=>{

commentsDiv.innerHTML+=`

<div class="comment">

<b>${c.user}</b>

<p>${c.comment}</p>

</div>

`;

});

}

});

});

}

function uploadUserFood(){

const imageFile=
document
.getElementById("userFoodImage")
.files[0];

const restaurant=
document
.getElementById("userRestaurant")
.value;

const foodname=
document
.getElementById("userFoodName")
.value;

const details=
document
.getElementById("userDetails")
.value;

if(
!imageFile ||
!restaurant ||
!foodname ||
!details
){

alert("Please fill all details");

return;

}

const reader=new FileReader();

reader.onload=function(){

const foodData={

image:reader.result,
restaurant,
foodname,
details,
uploadedBy:currentUser,
uploadedEmail:currentEmail,
time:Date.now()

};

db.ref("userUploads")
.push(foodData)
.then(()=>{

alert(
"Food uploaded successfully"
);

document
.getElementById("userRestaurant")
.value="";

document
.getElementById("userFoodName")
.value="";

document
.getElementById("userDetails")
.value="";

document
.getElementById("userFoodImage")
.value="";

});

};

reader.readAsDataURL(imageFile);

}

function rateFood(
foodId,
rating,
stars
){

stars.forEach((star)=>{

star.innerHTML="☆";
star.classList.remove("active");

});

for(let i=0;i<rating;i++){

stars[i].innerHTML="★";
stars[i].classList.add("active");

}

db.ref("foods/"+foodId)
.once("value")
.then((snapshot)=>{

const item=snapshot.val();

if(!item.ratings){

item.ratings=[];

}

const alreadyRated=
item.ratings.find((r)=>{

return r.email===currentEmail;

});

if(alreadyRated){

alert("You already rated");

return;

}

item.ratings.push({

user:currentUser,
email:currentEmail,
rating:rating

});

db.ref("foods/"+foodId)
.set(item)
.then(()=>{

alert(
"Rating saved successfully"
);

loadFoods();

});

});

}

function addComment(foodId){

const input=
document.getElementById(
"comment-"+foodId
);

const text=input.value.trim();

if(!text){

alert("Write review");

return;

}

db.ref("foods/"+foodId)
.once("value")
.then((snapshot)=>{

const item=snapshot.val();

if(!item.comments){

item.comments={};

}

const key=
Date.now();

item.comments[key]={

user:currentUser,
comment:text

};

db.ref("foods/"+foodId)
.set(item)
.then(()=>{

input.value="";

loadFoods();

alert(
"Review added successfully"
);

});

});

}

function toggleCommentBox(id){

const box=
document.getElementById(
"commentBox-"+id
);

box.classList.toggle("hidden");

}

function toggleComments(id){

const comments=
document.getElementById(
"comments-"+id
);

comments.classList.toggle("hidden");

}

function openImage(src){

const win=
window.open("");

win.document.write(`

<html>

<head>

<title>Food Image</title>

<style>

body{
margin:0;
background:black;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:auto;
}

img{
max-width:100%;
height:auto;
}

</style>

</head>

<body>

<img src="${src}">

</body>

</html>

`);

}

</script>

</body>
</html>
```
