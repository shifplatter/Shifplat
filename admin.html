<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ShifPlatter Admin Dashboard</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f4f4;
color:#222;
}

header{
background:black;
color:white;
padding:20px;
text-align:center;
}

.container{
max-width:1300px;
margin:auto;
padding:20px;
}

.tabs{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:20px;
}

.tab{
padding:12px 18px;
border:none;
border-radius:10px;
cursor:pointer;
background:white;
font-weight:bold;
}

.tab.active{
background:black;
color:white;
}

.panel{
display:none;
}

.panel.show{
display:block;
}

.card{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
margin-bottom:20px;
}

input,
textarea{
width:100%;
padding:12px;
margin-top:10px;
border-radius:12px;
border:1px solid #ccc;
}

button{
padding:12px;
border:none;
border-radius:10px;
cursor:pointer;
background:black;
color:white;
}

.gallery{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.food-card{
background:white;
border-radius:20px;
overflow:hidden;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

.food-card img{
width:100%;
height:240px;
object-fit:cover;
}

.food-content{
padding:15px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
}

th{
background:black;
color:white;
padding:12px;
}

td{
padding:12px;
border-bottom:1px solid #ddd;
}

.stats{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:20px;
}

.stat-card{
background:white;
padding:20px;
border-radius:20px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.1);
}

</style>

</head>

<body>

<header>

<h1>
🍔 ShifPlatter Admin Dashboard
</h1>

<p>
Manage Foods, User Uploads & Ratings
</p>

</header>

<div class="container">

<div class="tabs">

<button
class="tab active"
onclick="openTab('gallery',this)">
Gallery
</button>

<button
class="tab"
onclick="openTab('upload',this)">
Upload Food
</button>

<button
class="tab"
onclick="openTab('users',this)">
User Photos
</button>

<button
class="tab"
onclick="openTab('ratings',this)">
Ratings
</button>

</div>

<!-- Gallery -->

<div
id="gallery"
class="panel show">

<div
id="galleryGrid"
class="gallery">

</div>

</div>

<!-- Upload -->

<div
id="upload"
class="panel">

<div class="card">

<h2>Upload Food</h2>

<input
id="restaurant"
placeholder="Restaurant Name">

<input
id="food"
placeholder="Food Name">

<textarea
id="details"
placeholder="Food Details">
</textarea>

<input
id="imageUpload"
type="file">

<button
onclick="uploadFood()"
style="margin-top:15px;">
Upload Food
</button>

</div>

</div>
<!-- User Photos -->

<div
id="users"
class="panel">

<div class="card">

<h2>
User Uploaded Photos
</h2>

<table>

<thead>

<tr>

<th>
Photo
</th>

<th>
User
</th>

<th>
Restaurant
</th>

<th>
Food
</th>

<th>
Download
</th>

</tr>

</thead>

<tbody
id="userPhotosBody">

</tbody>

</table>

</div>

</div>

<!-- Ratings -->

<div
id="ratings"
class="panel">

<div class="stats">

<div class="stat-card">

<h2
id="totalFoods">

0

</h2>

<p>
Total Foods
</p>

</div>

<div class="stat-card">

<h2
id="totalRatings">

0

</h2>

<p>
Total Ratings
</p>

</div>

<div class="stat-card">

<h2
id="avgRating">

0

</h2>

<p>
Average Rating
</p>

</div>

</div>

<div class="card">

<h2>
Ratings Table
</h2>

<table>

<thead>

<tr>

<th>
User
</th>

<th>
Food
</th>

<th>
Rating
</th>

</tr>

</thead>

<tbody
id="ratingsBody">

</tbody>

</table>

</div>

</div>

</div>

<script>

function openTab(id,btn){

document
.querySelectorAll('.panel')
.forEach(panel=>{

panel.classList.remove('show');

});

document
.getElementById(id)
.classList.add('show');

document
.querySelectorAll('.tab')
.forEach(tab=>{

tab.classList.remove('active');

});

btn.classList.add('active');

}

</script>
<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
onSnapshot,
deleteDoc,
doc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

import {
getStorage,
ref,
uploadBytes,
getDownloadURL
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

const firebaseConfig = {

apiKey:
"AIzaSyCQ0YG2sulip67LaN7SBm4Bw6WduRchJTE",

authDomain:
"shifplatter-e0449.firebaseapp.com",

databaseURL:
"https://shifplatter-e0449-default-rtdb.asia-southeast1.firebasedatabase.app",

projectId:
"shifplatter-e0449",

storageBucket:
"shifplatter-e0449.firebasestorage.app",

messagingSenderId:
"873786528833",

appId:
"1:873786528833:web:e72394fec2ce9f8b52a2c0"

};

const app =
initializeApp(firebaseConfig);

const db =
getFirestore(app);

const storage =
getStorage(app);

window.db = db;
window.storage = storage;

window.collection = collection;
window.addDoc = addDoc;
window.getDocs = getDocs;
window.onSnapshot = onSnapshot;
window.deleteDoc = deleteDoc;
window.doc = doc;

window.ref = ref;
window.uploadBytes = uploadBytes;
window.getDownloadURL = getDownloadURL;
function loadGallery(){

const gallery =
document.getElementById(
"galleryGrid"
);

onSnapshot(
collection(db,"foods"),

(snapshot)=>{

gallery.innerHTML = "";

let totalFoods = 0;

snapshot.forEach(
(foodDoc)=>{

totalFoods++;

const data =
foodDoc.data();

const card =
document.createElement(
"div"
);

card.className =
"food-card";

card.innerHTML = `

<img
src="${data.imageUrl}">

<div class="food-content">

<h2>
${data.food}
</h2>

<h4>
${data.restaurant}
</h4>

<p>
${data.details}
</p>

<br>

<button
onclick="deleteFood(
'${foodDoc.id}'
)">
Delete
</button>

</div>

`;

gallery.appendChild(
card
);

});

document
.getElementById(
"totalFoods"
)
.innerText =
totalFoods;

}
);

}

window.deleteFood =
async function(id){

const ok =
confirm(
"Delete this food?"
);

if(!ok) return;

try{

await deleteDoc(
doc(
db,
"foods",
id
)
);

alert(
"Food Deleted"
);

}
catch(error){

console.error(
error
);

alert(
"Delete Failed"
);

}

}

loadGallery();
async function loadUserPhotos(){

const table =
document.getElementById(
"userPhotosBody"
);

table.innerHTML = "";

try{

const snapshot =
await getDocs(
collection(
db,
"userPhotos"
)
);

snapshot.forEach(
(docSnap)=>{

const data =
docSnap.data();

table.innerHTML += `

<tr>

<td>

<img
src="${data.imageUrl}"
width="80"
style="
border-radius:10px;
object-fit:cover;
">

</td>

<td>
${data.userName || "User"}
</td>

<td>
${data.restaurant || ""}
</td>

<td>
${data.foodName || ""}
</td>

<td>

<a
href="${data.imageUrl}"
target="_blank">

<button>
Download
</button>

</a>

</td>

</tr>

`;

});

}
catch(error){

console.error(
error
);

}

}

function loadRatings(){

const ratingsBody =
document.getElementById(
"ratingsBody"
);

onSnapshot(

collection(
db,
"ratings"
),

(snapshot)=>{

ratingsBody.innerHTML = "";

let totalRatings = 0;
let totalStars = 0;

snapshot.forEach(
(ratingDoc)=>{

const data =
ratingDoc.data();

totalRatings++;

totalStars +=
Number(
data.rating || 0
);

ratingsBody.innerHTML += `

<tr>

<td>
${data.userName || "Anonymous"}
</td>

<td>
${data.foodName || ""}
</td>

<td>
⭐ ${data.rating || 0}
</td>

</tr>

`;

});

document
.getElementById(
"totalRatings"
)
.innerText =
totalRatings;

const avg =
totalRatings > 0
?
(
totalStars /
totalRatings
).toFixed(1)
:
0;

document
.getElementById(
"avgRating"
)
.innerText =
avg;

});

}

loadUserPhotos();

loadRatings();

</script>

</body>

</html>
