<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShifPlatter Admin Panel</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
body{background:#111;color:white;min-height:100vh;}
.container{max-width:1200px;margin:auto;padding:16px;}
.topbar{display:flex;align-items:center;gap:16px;padding:16px;margin-bottom:24px;}
.top-logo{width:70px;height:70px;border-radius:18px;object-fit:contain;background:white;padding:5px;}
.top-title{font-size:28px;font-weight:900;color:#FFD700;}
.tab-buttons{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
.tab-buttons button{padding:10px 20px;border-radius:12px;border:none;background:#333;color:white;cursor:pointer;}
.tab-buttons button.active{background:#FFD700;color:black;}
.tab-content{display:none;}
.tab-content.active{display:block;}
.card{background:rgba(255,255,255,0.08);padding:22px;border-radius:28px;margin-bottom:24px;}
.user-image{width:100%;height:300px;object-fit:cover;border-radius:20px;}
.user-details{margin-top:12px;}
.user-details b{color:#FFD700;}
.stars{display:flex;gap:6px;margin-top:8px;}
.star{font-size:28px;color:#FFD700;}
@media(max-width:768px){.user-image{height:180px;}}
</style>
</head>
<body>

<div class="container">

<div class="topbar">
<img src="logo.png" class="top-logo">
<div class="top-title">ShifPlatter Admin Panel</div>
</div>

<div class="tab-buttons">
<button onclick="showTab('userPhotos')" class="active">User Photos</button>
<button onclick="showTab('ratings')">Ratings</button>
<button onclick="showTab('analytics')">Analytics</button>
</div>

<!-- Tabs -->
<div id="userPhotos" class="tab-content active">
<h2>👁️ User Uploaded Photos</h2>
<div id="userUploadsContainer">Loading...</div>
</div>

<div id="ratings" class="tab-content">
<h2>📊 Ratings Tracker</h2>
<div id="ratingsContainer">Loading...</div>
</div>

<div id="analytics" class="tab-content">
<h2>📈 Analytics</h2>
<div id="analyticsContainer">Coming soon...</div>
</div>

</div>

<script>

   const firebaseConfig = {
    apiKey: "AIzaSyCQ0YG2sulip67LaN7SBm4Bw6WduRchJTE",
    authDomain: "shifplatter-e0449.firebaseapp.com",
    databaseURL: "https://shifplatter-e0449-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shifplatter-e0449",
    storageBucket: "shifplatter-e0449.firebasestorage.app",
    messagingSenderId: "873786528833",
    appId: "1:873786528833:web:e72394fec2ce9f8b52a2c0"
  }; 
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function showTab(tabId){
  document.querySelectorAll('.tab-content').forEach(tc=>tc.classList.remove('active'));
  document.getElementById(tabId).classList.add('active');
  document.querySelectorAll('.tab-buttons button').forEach(btn=>btn.classList.remove('active'));
  document.querySelector(`.tab-buttons button[onclick="showTab('${tabId}')"]`).classList.add('active');
}

// Load user uploads
function loadUserUploads(){
  const container = document.getElementById("userUploadsContainer");
  container.innerHTML="";
  db.ref("userUploads").on("value", snapshot=>{
    const data = snapshot.val();
    container.innerHTML="";
    if(!data){ container.innerHTML="<p>No user uploads yet.</p>"; return;}
    Object.keys(data).forEach(id=>{
      const item = data[id];
      const avgRating = item.ratings ? (Object.values(item.ratings).reduce((a,b)=>a+(b.rating||0),0)/Object.values(item.ratings).length).toFixed(1) : "0";
      const card = document.createElement("div");
      card.className="card";
      card.innerHTML=`
        <img src="${item.image}" class="user-image">
        <div class="user-details">
          <p><b>Uploaded By:</b> ${item.uploadedName} (${item.uploadedBy})</p>
          <p><b>Restaurant:</b> ${item.restaurant}</p>
          <p><b>Food Name:</b> ${item.foodname}</p>
          <p><b>Details:</b> ${item.details}</p>
          <p><b>Rating:</b> ${avgRating} <span class="stars">${'★'.repeat(Math.round(avgRating))}</span></p>
        </div>
      `;
      container.appendChild(card);
    });
  });
}

// Load ratings
function loadRatings(){
  const container = document.getElementById("ratingsContainer");
  container.innerHTML="";
  db.ref("userUploads").on("value", snapshot=>{
    const data = snapshot.val();
    container.innerHTML="";
    if(!data){ container.innerHTML="<p>No ratings yet.</p>"; return;}
    Object.keys(data).forEach(id=>{
      const item = data[id];
      if(item.ratings){
        Object.values(item.ratings).forEach(r=>{
          const div = document.createElement("div");
          div.className="card";
          div.innerHTML=`<b>User:</b> ${r.user}<br><b>Food:</b> ${item.foodname}<br><b>Rating:</b> ${r.rating}`;
          container.appendChild(div);
        });
      }
    });
  });
}

// Initialize
loadUserUploads();
loadRatings();
</script>

</body>
</html>
