<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShifPlatter Admin</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0f172a;
color:white;
}

.hidden{
display:none !important;
}

/* LOGIN */

.login-page{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
padding:20px;
}

.login-card{
width:100%;
max-width:400px;
background:#1e293b;
padding:30px;
border-radius:20px;
}

.login-card h1{
text-align:center;
margin-bottom:25px;
}

.login-card input{
width:100%;
padding:14px;
border:none;
border-radius:12px;
margin-bottom:15px;
}

.login-btn{
width:100%;
padding:14px;
background:#22c55e;
border:none;
border-radius:12px;
color:white;
font-weight:bold;
cursor:pointer;
}

/* DASHBOARD */

.topbar{
height:70px;
background:#111827;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 20px;
}

.logo{
font-size:24px;
font-weight:800;
}

.logout-btn{
background:#ef4444;
border:none;
padding:10px 16px;
border-radius:10px;
color:white;
cursor:pointer;
}

.tabs{
display:flex;
gap:10px;
padding:20px;
}

.tab-btn{
padding:12px 20px;
border:none;
border-radius:10px;
background:#1e293b;
color:white;
cursor:pointer;
}

.active-tab{
background:#22c55e;
}

.content{
padding:20px;
}

.gallery-grid{
display:grid;
grid-template-columns:
repeat(auto-fill,minmax(300px,1fr));
gap:20px;
}

.food-card{
background:#1e293b;
border-radius:18px;
overflow:hidden;
}

.food-card img{
width:100%;
height:250px;
object-fit:cover;
}

.food-content{
padding:15px;
}

.food-title{
font-size:22px;
font-weight:700;
margin-bottom:8px;
}

.food-sub{
color:#94a3b8;
margin-bottom:10px;
}

.action-row{
display:flex;
gap:10px;
margin-top:15px;
}

.download-btn{
flex:1;
background:#3b82f6;
border:none;
padding:12px;
border-radius:10px;
color:white;
cursor:pointer;
}

.delete-btn{
flex:1;
background:#ef4444;
border:none;
padding:12px;
border-radius:10px;
color:white;
cursor:pointer;
}

.stats{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px;
margin-bottom:20px;
}

.stat-card{
background:#1e293b;
padding:20px;
border-radius:18px;
text-align:center;
}

.stat-number{
font-size:32px;
font-weight:800;
margin-top:10px;
}

@media(max-width:768px){

.stats{
grid-template-columns:1fr;
}

}

</style>

</head>

<body>

<!-- LOGIN -->

<div id="loginPage" class="login-page">

<div class="login-card">

<h1>ShifPlatter Admin</h1>

<input
id="username"
placeholder="Username">

<input
id="password"
type="password"
placeholder="Password">

<button
class="login-btn"
onclick="adminLogin()">

Login

</button>

</div>

</div>

<!-- DASHBOARD -->

<div id="adminPanel" class="hidden">

<div class="topbar">

<div class="logo">
ShifPlatter Admin
</div>

<button
class="logout-btn"
onclick="location.reload()">

Logout

</button>

</div>

<div class="tabs">

<button
class="tab-btn active-tab">

Gallery

</button>

</div>

<div class="content">

<div class="stats">

<div class="stat-card">
Total Uploads
<div
class="stat-number"
id="totalUploads">
0
</div>
</div>

<div class="stat-card">
Total Users
<div
class="stat-number"
id="totalUsers">
0
</div>
</div>

<div class="stat-card">
Total Ratings
<div
class="stat-number"
id="totalRatings">
0
</div>
</div>

</div>

<div
id="galleryContainer"
class="gallery-grid">

</div>

</div>

</div>

<script>

/* FIREBASE */

const firebaseConfig = {

apiKey: "AIzaSyCQ0YG2sulip67LaN7SBm4Bw6WduRchJTE",
authDomain: "shifplatter-e0449.firebaseapp.com",
databaseURL: "https://shifplatter-e0449-default-rtdb.asia-southeast1.firebasedatabase.app",
projectId: "shifplatter-e0449",
storageBucket: "shifplatter-e0449.firebasestorage.app",
messagingSenderId: "873786528833",
appId: "1:873786528833:web:e72394fec2ce9f8b52a2c0"

};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let foods = {};

</script>
<script>

/* ADMIN LOGIN */

function adminLogin(){

const username =
document.getElementById("username")
.value.trim();

const password =
document.getElementById("password")
.value.trim();

if(
username === "shifplatter" &&
password === "shivik"
){

document
.getElementById("loginPage")
.classList.add("hidden");

document
.getElementById("adminPanel")
.classList.remove("hidden");

loadFoods();

}
else{

alert("Invalid Login");

}

}

/* LOAD ALL FOODS */

function loadFoods(){

db.ref("foods")
.on("value",(snapshot)=>{

foods =
snapshot.val() || {};

renderGallery();
updateStats();

});

}

/* UPDATE STATS */

function updateStats(){

const uploads =
Object.keys(foods).length;

let users = new Set();

let ratings = 0;

Object.values(foods)
.forEach(food=>{

if(food.uploadedBy){

users.add(
food.uploadedBy
);

}

if(food.ratings){

ratings +=
Object.keys(
food.ratings
).length;

}

});

document
.getElementById("totalUploads")
.innerText = uploads;

document
.getElementById("totalUsers")
.innerText = users.size;

document
.getElementById("totalRatings")
.innerText = ratings;

}

/* GALLERY */

function renderGallery(){

const container =
document.getElementById(
"galleryContainer"
);

container.innerHTML = "";

const ids =
Object.keys(foods);

ids.reverse();

ids.forEach(id=>{

const item =
foods[id];

container.innerHTML += `

<div class="food-card">

<img
src="${item.image}">

<div class="food-content">

<div class="food-title">

${item.foodname || "Food"}

</div>

<div class="food-sub">

📍 ${item.restaurant || ""}

</div>

<div>

👤 @${item.uploadedBy || "Unknown"}

</div>

<div style="
margin-top:10px;
font-size:14px;
color:#cbd5e1;
">

${item.details || ""}

</div>

<div class="action-row">

<button
class="download-btn"
onclick="downloadImage(
'${item.image}',
'${item.foodname || "food"}'
)">

Download

</button>

<button
class="delete-btn"
onclick="deleteFood(
'${id}'
)">

Delete

</button>

</div>

</div>

</div>

`;

});

}

</script>
<script>

/* DOWNLOAD IMAGE */

function downloadImage(imageUrl,fileName){

const a =
document.createElement("a");

a.href = imageUrl;

a.download =
fileName + ".jpg";

document.body.appendChild(a);

a.click();

document.body.removeChild(a);

}

/* DELETE FOOD */

function deleteFood(foodId){

const confirmDelete =
confirm(
"Delete this food photo?"
);

if(!confirmDelete){
return;
}

db.ref(
"foods/" + foodId
)
.remove()
.then(()=>{

alert(
"Photo Deleted Successfully"
);

})
.catch(error=>{

alert(
"Error: " + error.message
);

});

}

/* OPTIONAL:
PRESS ENTER TO LOGIN */

document
.getElementById("password")
.addEventListener(
"keypress",
function(e){

if(e.key==="Enter"){

adminLogin();

}

}
);

</script>

</body>
</html>
