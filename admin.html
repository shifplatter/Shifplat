<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShiftPlatter Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

body{
  margin:0;
  padding:0;
  background:#f5f5f5;
  font-family:Arial,sans-serif;
}

.container{
  max-width:1000px;
  margin:auto;
  padding:15px;
}

.card{
  background:white;
  padding:15px;
  border-radius:20px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
}

.tab-btn{
  flex:1;
  padding:12px;
  border:none;
  border-radius:14px;
  background:#e5e5e5;
  font-weight:bold;
}

.active-tab{
  background:black;
  color:white;
}

.hidden{
  display:none;
}

.food-card{
  display:flex;
  gap:15px;
}

.food-image{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:14px;
  cursor:pointer;
}

.plus-btn{
  position:fixed;
  right:20px;
  bottom:20px;
  width:65px;
  height:65px;
  border-radius:50%;
  background:black;
  color:white;
  font-size:35px;
  border:none;
}

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:white;
  width:90%;
  max-width:450px;
  padding:20px;
  border-radius:24px;
}

input,textarea{
  width:100%;
  padding:14px;
  border-radius:14px;
  border:1px solid #ddd;
  margin-top:12px;
  box-sizing:border-box;
}

button{
  cursor:pointer;
}

.full-btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  background:black;
  color:white;
  margin-top:15px;
}

.rating-bar{
  width:100%;
  height:28px;
  background:#ddd;
  border-radius:30px;
  overflow:hidden;
  margin-top:15px;
}

.rating-fill{
  height:100%;
  background:black;
  color:white;
  display:flex;
  align-items:center;
  justify-content:center;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  border:1px solid #ddd;
  padding:8px;
  font-size:14px;
}

</style>

</head>
<body>

<div class="container">

  <h1>ShiftPlatter Admin</h1>

  <div class="tabs">

    <button
      class="tab-btn active-tab"
      onclick="showTab('galleryTab',this)">
      Gallery
    </button>

    <button
      class="tab-btn"
      onclick="showTab('trackerTab',this)">
      Tracker
    </button>

    <button
      class="tab-btn"
      onclick="showTab('audienceTab',this)">
      Audience
    </button>

  </div>

  <div id="galleryTab">

    <div id="gallery"></div>

  </div>

  <div id="trackerTab" class="hidden">

    <div id="tracker"></div>

  </div>

  <div id="audienceTab" class="hidden">

    <div id="audience"></div>

  </div>

</div>

<button
  class="plus-btn"
  onclick="openModal()">
  +
</button>

<div class="modal" id="modal">

  <div class="modal-content">

    <h2>Upload Food</h2>

    <input
      type="file"
      id="foodImage"
      accept="image/*"
    >

    <input
      type="text"
      id="restaurantName"
      placeholder="Restaurant Name"
    >

    <input
      type="text"
      id="foodName"
      placeholder="Food Name"
    >

    <textarea
      id="foodDetails"
      placeholder="Food Details">
    </textarea>

    <button
      class="full-btn"
      onclick="uploadFood()">
      Upload
    </button>

  </div>

</div>

<script>

const firebaseConfig = {
    apiKey: "AIzaSyCQ0YG2sulip67LaN7SBm4Bw6WduRchJTE",
    authDomain: "shifplatter-e0449.firebaseapp.com",
    databaseURL: "https://shifplatter-e0449-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shifplatter-e0449",
    storageBucket: "shifplatter-e0449.firebasestorage.app",
    messagingSenderId: "873786528833",
    appId: "1:873786528833:web:e72394fec2ce9f8b52a2c0"
  };

firebase.initializeApp(firebaseConfig);

const db=firebase.database();

function showTab(tabId,btn){

  document
    .querySelectorAll(
      "#galleryTab,#trackerTab,#audienceTab"
    )
    .forEach((tab)=>{

      tab.classList.add("hidden");

    });

  document
    .getElementById(tabId)
    .classList.remove("hidden");

  document
    .querySelectorAll(".tab-btn")
    .forEach((b)=>{

      b.classList.remove("active-tab");

    });

  btn.classList.add("active-tab");

}

function openModal(){

  document
    .getElementById("modal")
    .style.display="flex";

}

window.onclick=function(e){

  const modal=
    document.getElementById("modal");

  if(e.target===modal){

    modal.style.display="none";

  }

};

function uploadFood(){

  const imageFile=
    document.getElementById("foodImage")
    .files[0];

  const restaurant=
    document.getElementById("restaurantName")
    .value;

  const foodname=
    document.getElementById("foodName")
    .value;

  const details=
    document.getElementById("foodDetails")
    .value;

  if(
    !imageFile ||
    !restaurant ||
    !foodname ||
    !details
  ){

    alert("Please fill all details");

    return;

  }

  const reader=new FileReader();

  reader.onload=function(){

    const img=new Image();

    img.onload=function(){

      const canvas=
        document.createElement("canvas");

      const ctx=
        canvas.getContext("2d");

      canvas.width=300;
      canvas.height=300;

      ctx.drawImage(
        img,
        0,
        0,
        300,
        300
      );

      const compressed=
        canvas.toDataURL(
          "image/jpeg",
          0.6
        );

      const foodData={

        image:compressed,
        restaurant,
        foodname,
        details,
        ratings:[]

      };

      db.ref("foods")
      .push(foodData)
      .then(()=>{

        alert("Food uploaded");

        document
          .getElementById("modal")
          .style.display="none";

        loadFoods();

      });

    };

    img.src=reader.result;

  };

  reader.readAsDataURL(imageFile);

}

function loadFoods(){

  db.ref("foods")
  .limitToLast(20)
  .once("value")
  .then((snapshot)=>{

    const data=snapshot.val();

    const gallery=
      document.getElementById("gallery");

    const tracker=
      document.getElementById("tracker");

    const audience=
      document.getElementById("audience");

    gallery.innerHTML="";
    tracker.innerHTML="";
    audience.innerHTML="";

    if(!data){

      gallery.innerHTML=`
        <div class="card">
          No foods uploaded
        </div>
      `;

      return;

    }

    Object.keys(data)
    .reverse()
    .forEach((id)=>{

      const item=data[id];

      if(!item.ratings){

        item.ratings=[];

      }

      let total=0;

      item.ratings.forEach((r)=>{

        total+=Number(r.rating||0);

      });

      let avg=0;

      if(item.ratings.length>0){

        avg=
          total/item.ratings.length;

      }

      // GALLERY
      gallery.innerHTML+=`

        <div class="card">

          <div class="food-card">

            <img
              class="food-image"
              src="${item.image}"
              onclick="window.open('${item.image}')"
            >

            <div>

              <h3>${item.foodname}</h3>

              <p>
                <b>${item.restaurant}</b>
              </p>

              <p>${item.details}</p>

            </div>

          </div>

        </div>

      `;

      // TRACKER
      tracker.innerHTML+=`

        <div class="card">

          <h3>${item.foodname}</h3>

          <p>${item.restaurant}</p>

          <div class="rating-bar">

            <div
              class="rating-fill"
              style="width:${avg*20}%">

              ${avg.toFixed(1)}/5

            </div>

          </div>

          <p>
            ${item.ratings.length}
            Ratings
          </p>

        </div>

      `;

      // AUDIENCE
      let rows="";

      item.ratings.forEach((r)=>{

        rows+=`

          <tr>

            <td>${r.user}</td>

            <td>${r.email}</td>

            <td>⭐ ${r.rating}</td>

          </tr>

        `;

      });

      audience.innerHTML+=`

        <div class="card">

          <h3>${item.foodname}</h3>

          <table>

            <tr>

              <th>User</th>
              <th>Email</th>
              <th>Rating</th>

            </tr>

            ${rows}

          </table>

        </div>

      `;

    });

  });

}

loadFoods();

</script>

</body>
</html>
