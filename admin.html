<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  background:#f5f5f5;
}
.container{
  max-width:1000px;
  margin:auto;
  padding:15px;
}
h1{
  text-align:center;
}
.card{
  background:white;
  padding:15px;
  border-radius:18px;
  margin-bottom:15px;
  box-shadow:0 2px 8px rgba(0,0,0,0.08);
}
input,textarea{
  width:100%;
  padding:14px;
  margin-top:12px;
  border-radius:14px;
  border:1px solid #ddd;
  box-sizing:border-box;
}
button{
  border:none;
  padding:14px;
  border-radius:14px;
  cursor:pointer;
}
.full-btn{
  width:100%;
  background:black;
  color:white;
  margin-top:15px;
}
.tabs{
  display:flex;
  gap:8px;
  margin-bottom:20px;
  overflow:auto;
}
.tab-btn{
  flex:1;
  background:#e5e5e5;
  font-weight:bold;
  white-space:nowrap;
}
.active-tab{
  background:black;
  color:white;
}
.hidden{
  display:none;
}
.food-card{
  display:flex;
  gap:15px;
  align-items:center;
}
.food-image{
  width:90px;
  height:90px;
  object-fit:cover;
  border-radius:14px;
  cursor:pointer;
  flex-shrink:0;
}
.plus-btn{
  position:fixed;
  bottom:25px;
  right:25px;
  width:65px;
  height:65px;
  border-radius:50%;
  background:black;
  color:white;
  font-size:34px;
  display:flex;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}
.table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}
.table th,
.table td{
  border:1px solid #ddd;
  padding:10px;
  font-size:14px;
}
.gauge-wrap{
  margin-top:15px;
}
.gauge{
  width:100%;
  height:18px;
  background:#ddd;
  border-radius:30px;
  overflow:hidden;
}
.gauge-fill{
  height:100%;
  background:linear-gradient(90deg,#00c853,#64dd17);
}
.gauge-text{
  margin-top:8px;
  font-size:14px;
  font-weight:bold;
}
</style>
</head>
<body>

<div class="container">

<h1>Admin Dashboard</h1>

<div class="tabs">
<button class="tab-btn active-tab" onclick="showTab('galleryTab',this)">Food Gallery</button>
<button class="tab-btn" onclick="showTab('trackerTab',this)">Overall Ratings</button>
<button class="tab-btn" onclick="showTab('audienceTab',this)">Audience Ratings</button>
<button class="tab-btn" onclick="showTab('usersPhotoTab',this)">Users Photo</button>
</div>

<div id="galleryTab"></div>
<div id="trackerTab" class="hidden"></div>
<div id="audienceTab" class="hidden"></div>
<div id="usersPhotoTab" class="hidden"></div>

<div class="plus-btn" onclick="openUploadForm()">+</div>

<div id="uploadModal" class="hidden">
  <div class="card">
    <h2>Upload Food</h2>
    <input type="file" id="foodImage" accept="image/*">
    <input type="text" id="restaurant" placeholder="Restaurant / Cafe Name">
    <input type="text" id="foodname" placeholder="Food Name">
    <textarea id="details" placeholder="Food Details"></textarea>
    <button class="full-btn" onclick="uploadFood()">Save Food</button>
    <button class="full-btn" style="background:#888" onclick="closeUploadForm()">Close</button>
  </div>
</div>

</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCQ0YG2sulip67LaN7SBm4Bw6WduRchJTE",
    authDomain: "shifplatter-e0449.firebaseapp.com",
    databaseURL: "https://shifplatter-e0449-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shifplatter-e0449",
    storageBucket: "shifplatter-e0449.firebasestorage.app",
    messagingSenderId: "873786528833",
    appId: "1:873786528833:web:e72394fec2ce9f8b52a2c0"
  };

firebase.initializeApp(firebaseConfig);
const db = firebase.database();

// Tab switching
function showTab(tabId, btn){
  document.querySelectorAll('#galleryTab,#trackerTab,#audienceTab,#usersPhotoTab').forEach(tab=>{
    tab.classList.add('hidden');
  });
  document.getElementById(tabId).classList.remove('hidden');
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active-tab'));
  btn.classList.add('active-tab');
}

// Open/Close upload
function openUploadForm(){document.getElementById('uploadModal').classList.remove('hidden');}
function closeUploadForm(){document.getElementById('uploadModal').classList.add('hidden');}

// Upload food (admin)
function uploadFood(){
  const imageFile = document.getElementById('foodImage').files[0];
  const restaurant = document.getElementById('restaurant').value;
  const foodname = document.getElementById('foodname').value;
  const details = document.getElementById('details').value;

  if(!imageFile || !restaurant || !foodname || !details){ alert("Fill all details"); return; }

  const reader = new FileReader();
  reader.onload = function(){
    const foodData = {image:reader.result, restaurant, foodname, details, ratings:[], time:Date.now()};
    db.ref('foods').push(foodData).then(()=>{
      alert('Food uploaded successfully');
      closeUploadForm();
    });
  }
  reader.readAsDataURL(imageFile);
}

// Load all data in real-time
function loadAdminData(){
  const gallery = document.getElementById('galleryTab');
  const tracker = document.getElementById('trackerTab');
  const audience = document.getElementById('audienceTab');
  const uploads = document.getElementById('usersPhotoTab');

  db.ref('foods').on('value', snapshot=>{
    const data = snapshot.val()||{};
    gallery.innerHTML=''; tracker.innerHTML=''; audience.innerHTML='';
    Object.keys(data).reverse().forEach(id=>{
      const item = data[id];
      const ratingsArr = item.ratings||[];
      const avg = ratingsArr.length ? ratingsArr.reduce((a,b)=>a+(b.rating||0),0)/ratingsArr.length : 0;

      gallery.innerHTML+=`
        <div class="card">
          <div class="food-card">
            <img class="food-image" src="${item.image}" onclick="window.open('${item.image}')" >
            <div>
              <h3>${item.foodname}</h3>
              <p><b>${item.restaurant}</b></p>
              <p>${item.details}</p>
            </div>
          </div>
        </div>`;
      tracker.innerHTML+=`
        <div class="card">
          <h3>${item.foodname}</h3>
          <p>${item.restaurant}</p>
          <div class="gauge-wrap">
            <div class="gauge"><div class="gauge-fill" style="width:${avg*20}%"></div></div>
            <div class="gauge-text">${avg.toFixed(1)}/5 Overall Rating</div>
          </div>
        </div>`;
      let tableRows='';
      ratingsArr.forEach(r=>{
        tableRows+=`<tr><td>${r.user}</td><td>${r.email}</td><td>${r.rating} ⭐</td></tr>`;
      });
      audience.innerHTML+=`
        <div class="card">
          <h3>${item.foodname}</h3>
          <table class="table">
            <tr><th>User</th><th>Email</th><th>Rating</th></tr>
            ${tableRows}
          </table>
        </div>`;
    });
  });

  // User uploaded photos
  db.ref('userUploads').on('value', snap=>{
    const uploadsData = snap.val()||{};
    uploads.innerHTML='';
    Object.keys(uploadsData).reverse().forEach(id=>{
      const item = uploadsData[id];
      uploads.innerHTML+=`
        <div class="card">
          <div class="food-card">
            <img class="food-image" src="${item.image}" onclick="window.open('${item.image}')" >
            <div>
              <h3>${item.foodname}</h3>
              <p><b>${item.restaurant}</b></p>
              <p>${item.details}</p>
              <p><b>Uploaded By:</b> ${item.uploadedBy}</p>
              <p><b>Email:</b> ${item.uploadedEmail}</p>
              <a href="${item.image}" download="food-image.jpg"><button class="full-btn">Download HD Image</button></a>
            </div>
          </div>
        </div>`;
    });
  });
}

window.onload = loadAdminData;
</script>
</body>
</html>
