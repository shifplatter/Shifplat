<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ShifPlatter Admin</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#111;
color:white;
}

.header{
padding:20px;
background:#000;
position:sticky;
top:0;
z-index:1000;
border-bottom:1px solid #333;
}

.title{
font-size:28px;
font-weight:900;
}

.count{
margin-top:8px;
color:#FFD700;
font-weight:700;
}

.search{
width:100%;
padding:14px;
margin-top:15px;
border:none;
border-radius:12px;
font-size:15px;
}

.container{
padding:15px;
}

.card{
background:#1c1c1c;
border-radius:18px;
overflow:hidden;
margin-bottom:20px;
border:1px solid #2c2c2c;
}

.food-image{
width:100%;
aspect-ratio:1/1;
object-fit:cover;
background:#000;
}

.content{
padding:15px;
}

.food-name{
font-size:20px;
font-weight:800;
}

.restaurant{
color:#FFD700;
margin-top:5px;
}

.user{
margin-top:10px;
font-size:14px;
color:#ccc;
}

.time{
margin-top:6px;
font-size:12px;
color:#888;
}

.actions{
display:flex;
gap:10px;
margin-top:15px;
}

.btn{
flex:1;
padding:12px;
border:none;
border-radius:12px;
font-weight:700;
cursor:pointer;
}

.download-btn{
background:#FFD700;
color:#000;
}

.delete-btn{
background:#ff3b30;
color:white;
}

.empty{
text-align:center;
padding:40px;
color:#aaa;
}

</style>

</head>

<body>

<script>

const enteredPassword = prompt("Enter Admin Password");

if(enteredPassword !== "shifplatter123"){

document.body.innerHTML = `
<div style="
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-size:28px;
font-weight:bold;
">
❌ Access Denied
</div>
`;

throw new Error("Access Denied");

}

</script>

<div class="header">

<div class="title">
🍽 ShifPlatter Admin
</div>

<div class="count" id="uploadCount">
Total Uploads: 0
</div>

<input
type="text"
id="searchInput"
class="search"
placeholder="Search food, restaurant or username">

</div>

<div id="foodsContainer" class="container"></div>

<script>

/* FIREBASE */

const firebaseConfig = {
    apiKey: "AIzaSyCQ0YG2sulip67LaN7SBm4Bw6WduRchJTE",
    authDomain: "shifplatter-e0449.firebaseapp.com",
    databaseURL: "https://shifplatter-e0449-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shifplatter-e0449",
    storageBucket: "shifplatter-e0449.firebasestorage.app",
    messagingSenderId: "873786528833",
    appId: "1:873786528833:web:e72394fec2ce9f8b52a2c0"
  };

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

let foodsCache = {};

db.ref("foods").on("value",(snapshot)=>{

foodsCache = snapshot.val() || {};

renderFoods();

});

document
.getElementById("searchInput")
.addEventListener("input",renderFoods);

function renderFoods(){

const container =
document.getElementById("foodsContainer");

container.innerHTML = "";

const search =
document.getElementById("searchInput")
.value
.toLowerCase();

let count = 0;

Object.keys(foodsCache)
.reverse()
.forEach(id=>{

const item = foodsCache[id];

const food =
(item.foodname || "")
.toLowerCase();

const restaurant =
(item.restaurant || "")
.toLowerCase();

const user =
(item.uploadedBy || "")
.toLowerCase();

if(
search &&
!food.includes(search) &&
!restaurant.includes(search) &&
!user.includes(search)
){
return;
}

count++;

container.innerHTML += `

<div class="card">

<img
src="${item.image}"
class="food-image">

<div class="content">

<div class="food-name">
${item.foodname || "Unnamed Food"}
</div>

<div class="restaurant">
${item.restaurant || ""}
</div>

<div class="user">
Uploaded by:
@${item.uploadedBy || "Unknown"}
</div>

<div class="time">
${item.uploadTime
? new Date(item.uploadTime)
.toLocaleString()
: ""}
</div>

<div class="actions">

<button
class="btn download-btn"
onclick="downloadImage('${item.image}')">

⬇ Download

</button>

<button
class="btn delete-btn"
onclick="deleteFood('${id}')">

🗑 Delete

</button>

</div>

</div>

</div>

`;

});

document.getElementById(
"uploadCount"
).innerHTML =
`Total Uploads: ${count}`;

if(count===0){

container.innerHTML =
`<div class="empty">
No uploads found
</div>`;

}

}

function downloadImage(url){

const link =
document.createElement("a");

link.href = url;

link.download =
"shifplatter-image";

document.body.appendChild(link);

link.click();

link.remove();

}

function deleteFood(id){

const ok =
confirm(
"Delete this food photo?"
);

if(!ok) return;

db.ref("foods/"+id)
.remove()
.then(()=>{

alert("Deleted Successfully");

});

}

</script>

</body>
</html>
