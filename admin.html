<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShifPlatter Admin - User Photos</title>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
body{
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
  background: linear-gradient(rgba(0,0,0,0.55),rgba(0,0,0,0.55)), 
    url("https://images.unsplash.com/photo-1504674900247-0877df9cc836?q=80&w=1600&auto=format&fit=crop");
  background-size: cover;
  background-position: center;
  color:white;
  min-height:100vh;
}
.container{
  width:100%;
  max-width:1200px;
  margin:auto;
  padding:16px;
}
.topbar{
  padding:15px 18px;
  border-radius:24px;
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:18px;
  background: rgba(0,0,0,0.35);
}
.top-title{
  font-size:26px;
  font-weight:900;
}
.card{
  padding:20px;
  border-radius:30px;
  margin-bottom:22px;
  box-shadow:0 8px 25px rgba(0,0,0,0.22);
  background: rgba(255,255,255,0.12);
  backdrop-filter:blur(15px);
}
.food-image{
  width:100%;
  height:300px;
  object-fit:cover;
  border-radius:24px;
  cursor:pointer;
}
.food-title{
  font-size:28px;
  font-weight:900;
  margin-top:16px;
}
.food-sub{
  font-size:15px;
  margin-top:6px;
  color:#ddd;
}
.food-desc{
  margin-top:12px;
  font-size:14px;
  line-height:1.7;
  color:#f1f1f1;
}
.download-btn{
  padding:12px 16px;
  border-radius:16px;
  background:#FFD700;
  color:black;
  border:none;
  font-weight:900;
  cursor:pointer;
  margin-top:12px;
}
@media(max-width:768px){
  .food-image{height:200px;}
  .food-title{font-size:22px;}
}
</style>
</head>
<body>

<div class="container">

  <div class="topbar">
    <div class="top-title">ShifPlatter Admin - User Photos</div>
  </div>

  <div id="userPhotosContainer"></div>

</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCQ0YG2sulip67LaN7SBm4Bw6WduRchJTE",
    authDomain: "shifplatter-e0449.firebaseapp.com",
    databaseURL: "https://shifplatter-e0449-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shifplatter-e0449",
    storageBucket: "shifplatter-e0449.firebasestorage.app",
    messagingSenderId: "873786528833",
    appId: "1:873786528833:web:e72394fec2ce9f8b52a2c0"
  };
firebase.initializeApp(firebaseConfig);
const db = firebase.database();

function loadUserPhotos(){
  const container = document.getElementById('userPhotosContainer');
  db.ref('userUploads').on('value', snapshot=>{
    const data = snapshot.val() || {};
    container.innerHTML = '';
    Object.keys(data).reverse().forEach(id=>{
      const item = data[id];
      container.innerHTML += `
        <div class="card">
          <img src="${item.image}" class="food-image" onclick="window.open('${item.image}')">
          <div class="food-title">${item.foodname}</div>
          <div class="food-sub">${item.restaurant}</div>
          <div class="food-desc">Uploaded by: ${item.uploadedName} (${item.uploadedBy})</div>
          <a href="${item.image}" download="food-image.jpg"><button class="download-btn">Download HD</button></a>
        </div>
      `;
    });
  });
}

// Load user-uploaded photos on page load
loadUserPhotos();
</script>

</body>
</html>
