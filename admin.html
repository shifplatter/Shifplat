<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShifPlatter Admin Panel</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
body{margin:0;padding:0;font-family:Arial,sans-serif;background:#f5f5f5;}
.container{max-width:1200px;margin:auto;padding:16px;}
h1{text-align:center;margin-bottom:24px;}
.tabs{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px;}
.tab-btn{flex:1;padding:12px;background:#e5e5e5;border:none;font-weight:bold;cursor:pointer;border-radius:10px;}
.tab-btn.active-tab{background:black;color:white;}
.tab-content{display:none;}
.tab-content.active{display:block;}
.card{background:white;padding:16px;border-radius:20px;margin-bottom:20px;box-shadow:0 4px 15px rgba(0,0,0,0.1);}
.food-card{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;}
.food-image{width:100px;height:100px;object-fit:cover;border-radius:12px;cursor:pointer;}
.table{width:100%;border-collapse:collapse;margin-top:12px;}
.table th,.table td{border:1px solid #ddd;padding:8px;font-size:14px;}
.gauge-wrap{margin-top:8px;}
.gauge{width:100%;height:16px;background:#ddd;border-radius:30px;overflow:hidden;}
.gauge-fill{height:100%;background:linear-gradient(90deg,#00c853,#64dd17);}
.gauge-text{margin-top:6px;font-size:14px;font-weight:bold;}
.full-btn{border:none;padding:10px 12px;border-radius:12px;background:black;color:white;cursor:pointer;margin-top:8px;}
</style>
</head>
<body>

<div class="container">
<h1>ShifPlatter Admin Panel</h1>
<div class="tabs">
<button class="tab-btn active-tab" onclick="showTab('galleryTab',this)">Food Gallery</button>
<button class="tab-btn" onclick="showTab('trackerTab',this)">Overall Ratings</button>
<button class="tab-btn" onclick="showTab('audienceTab',this)">Audience Ratings</button>
<button class="tab-btn" onclick="showTab('usersPhotoTab',this)">Users Photo</button>
</div>

<div id="galleryTab" class="tab-content active"></div>
<div id="trackerTab" class="tab-content"></div>
<div id="audienceTab" class="tab-content"></div>
<div id="usersPhotoTab" class="tab-content"></div>
</div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyCQ0YG2sulip67LaN7SBm4Bw6WduRchJTE",
    authDomain: "shifplatter-e0449.firebaseapp.com",
    databaseURL: "https://shifplatter-e0449-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "shifplatter-e0449",
    storageBucket: "shifplatter-e0449.firebasestorage.app",
    messagingSenderId: "873786528833",
    appId: "1:873786528833:web:e72394fec2ce9f8b52a2c0"
  };
firebase.initializeApp(firebaseConfig);
const db=firebase.database();

// TAB SWITCH
function showTab(tabId,btn){
document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
document.getElementById(tabId).classList.add('active');
document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active-tab'));
btn.classList.add('active-tab');
}

// LOAD DATA
function loadAdminData(){
const gallery=document.getElementById('galleryTab');
const tracker=document.getElementById('trackerTab');
const audience=document.getElementById('audienceTab');
const uploads=document.getElementById('usersPhotoTab');

db.ref('foods').on('value',snap=>{
const data = snap.val()||{};
gallery.innerHTML=tracker.innerHTML=audience.innerHTML='';
Object.keys(data).reverse().forEach(id=>{
const item = data[id];
const ratingsArr = item.ratings||[];
const avg = ratingsArr.length ? ratingsArr.reduce((a,b)=>a+b.rating,0)/ratingsArr.length : 0;

// Food Gallery
gallery.innerHTML+=`<div class="card"><div class="food-card"><img class="food-image" src="${item.image}" onclick="window.open('${item.image}')"><div><h3>${item.foodname}</h3><p><b>${item.restaurant}</b></p><p>${item.details}</p></div></div></div>`;

// Tracker
tracker.innerHTML+=`<div class="card"><h3>${item.foodname}</h3><p>${item.restaurant}</p><div class="gauge-wrap"><div class="gauge"><div class="gauge-fill" style="width:${avg*20}%"></div></div><div class="gauge-text">${avg.toFixed(1)}/5 Overall Rating</div></div></div>`;

// Audience
let tableRows='';
ratingsArr.forEach(r=>{tableRows+=`<tr><td>${r.user}</td><td>${r.email||'N/A'}</td><td>${r.rating} ⭐</td></tr>`});
audience.innerHTML+=`<div class="card"><h3>${item.foodname}</h3><table class="table"><tr><th>User</th><th>Email</th><th>Rating</th></tr>${tableRows}</table></div>`;
});

// User Uploads
db.ref('userUploads').on('value',snap=>{
const data=snap.val()||{};
uploads.innerHTML='';
Object.keys(data).reverse().forEach(id=>{
const item=data[id];
uploads.innerHTML+=`<div class="card"><div class="food-card"><img class="food-image" src="${item.image}" onclick="window.open('${item.image}')"><div><h3>${item.foodname}</h3><p><b>${item.restaurant}</b></p><p>${item.details}</p><p><b>Uploaded By:</b> ${item.uploadedName} (${item.uploadedBy})</p><p><b>Email:</b> ${item.uploadedEmail}</p><a href="${item.image}" download="food-image.jpg"><button class="full-btn">Download HD Image</button></a></div></div></div>`;
});
});
}

window.onload=loadAdminData;
</script>
</body>
</html>
